name: Update Google Scholar stats

on:
  schedule:
    - cron: "17 9 * * 1"  # Mondays, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_scholar.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - name: Commit if changed
        run: |
          git diff --quiet assets/data/scholar.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add assets/data/scholar.json
          git commit -m "Update Google Scholar stats"
          git push
