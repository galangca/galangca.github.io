<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workplace Evaluation Study</title>

  <script src="https://unpkg.com/jspsych@8.3.0"></script>
  <link href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" rel="stylesheet">

  <!-- Official Pavlovia bridge used by the reference study and Pavlovia's jsPsych guide. -->
  <script src="https://pavlovia.org/lib/jspsych-7-pavlovia-2022.1.1.js"></script>

  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@2.1.0"></script>

  <style>
    :root {
      --accent: #7a003c;
      --accent-dark: #5a002c;
      --accent-soft: #f5eaf0;
      --ink: #24211f;
      --muted: #706b66;
      --line: #ded9d1;
      --paper: #fffefb;
      --canvas: #f7f5ef;
      --soft: #f1eee7;
      --shadow: 0 14px 38px rgba(54, 42, 34, 0.08);
    }

    * { box-sizing: border-box; }
    html { background: var(--canvas); }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(122, 0, 60, 0.045), transparent 30rem),
        var(--canvas);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    .jspsych-display-element {
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      line-height: 1.6;
    }

    #jspsych-content {
      width: min(100% - 32px, 800px);
      max-width: 800px;
      margin: 0 auto;
      padding: 34px 0 54px;
    }

    .study-wrap { width: 100%; text-align: left; }

    .paper-card {
      width: 100%;
      padding: 38px 44px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .paper-card.compact { padding-top: 32px; padding-bottom: 32px; }
    .paper-card.centered { text-align: center; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1, h2, h3 { color: var(--ink); font-weight: 400; }
    h1 { margin: 0 0 16px; font-size: clamp(30px, 5vw, 42px); line-height: 1.12; }
    h2 { margin: 0 0 18px; font-size: 26px; line-height: 1.25; }
    h3 { margin: 0 0 10px; font-size: 19px; }
    p { margin: 12px 0; }

    .lead { font-size: 19px; line-height: 1.65; }
    .muted { color: var(--muted); }
    .small { font-size: 14px; }

    .prototype-note,
    .setup-warning {
      margin: 0 0 18px;
      padding: 12px 15px;
      border: 1px solid #e6c9d7;
      border-left: 4px solid var(--accent);
      border-radius: 4px;
      background: #fff8fb;
      color: #5f1839;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      line-height: 1.45;
    }

    .study-facts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 26px 0;
    }

    .study-fact {
      min-height: 100px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }

    .study-fact strong {
      display: block;
      margin-bottom: 5px;
      color: var(--accent);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .instruction-list { margin: 20px 0 0; padding-left: 22px; }
    .instruction-list li { margin: 10px 0; padding-left: 5px; }

    .consent-copy {
      max-height: 300px;
      overflow-y: auto;
      margin: 20px 0;
      padding: 20px 22px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #fbfaf7;
      font-size: 15px;
    }

    .consent-copy p:first-child { margin-top: 0; }
    .consent-copy p:last-child { margin-bottom: 0; }

    .consent-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 18px 0 0;
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #fff;
      font-size: 15px;
      line-height: 1.45;
    }

    .consent-label input { flex: 0 0 auto; margin-top: 4px; accent-color: var(--accent); }

    .progress-wrap { width: 100%; margin: 0 0 18px; }
    .progress-track { width: 100%; height: 7px; overflow: hidden; border-radius: 999px; background: #e7e2da; }
    .progress-fill { height: 100%; border-radius: inherit; background: var(--accent); transition: width 180ms ease; }
    .progress-label { margin-top: 6px; color: var(--muted); font-family: Arial, Helvetica, sans-serif; font-size: 12px; text-align: right; }

    .scenario-card {
      padding: 34px 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .scenario-card h2 { margin-bottom: 24px; color: var(--accent); }
    .scenario-text { font-size: 18px; line-height: 1.75; }

    .outcome-panel {
      margin-top: 24px;
      padding: 17px 20px;
      border-left: 4px solid var(--accent);
      border-radius: 0 5px 5px 0;
      background: var(--soft);
      line-height: 1.6;
    }

    .outcome-label {
      display: block;
      margin-bottom: 5px;
      color: var(--accent);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .ratings-header { margin-bottom: 18px; }

    .rating-instructions {
      margin: 14px 0 20px;
      padding: 12px 15px;
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
      color: #4f1832;
      font-size: 14px;
    }

    .rating-section-label {
      margin: 28px 0 10px;
      color: var(--accent);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .rating-card {
      margin: 12px 0;
      padding: 19px 20px 17px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }

    .rating-question {
      display: block;
      margin-bottom: 15px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
    }

    .slider-grid {
      display: grid;
      grid-template-columns: 98px minmax(180px, 1fr) 98px;
      gap: 13px;
      align-items: center;
    }

    .slider-control { min-width: 0; }

    .slider-control input[type="range"] {
      width: 100%;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .slider-control input[type="range"]:focus-visible {
      outline: 3px solid rgba(23, 105, 170, 0.35);
      outline-offset: 5px;
      border-radius: 999px;
    }

    .anchor { color: var(--muted); font-family: Arial, Helvetica, sans-serif; font-size: 11px; line-height: 1.3; }
    .anchor.right { text-align: right; }

    .live-value {
      width: 48px;
      min-height: 29px;
      margin: 8px auto 0;
      padding: 3px 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #faf9f6;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      text-align: center;
    }

    .rating-card.touched { border-color: #c6a0b3; background: #fffcfd; }
    .rating-card.touched .live-value { border-color: #c6a0b3; color: var(--accent); background: var(--accent-soft); }

    .completion-status {
      min-height: 22px;
      margin: 15px 0 0;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      text-align: center;
    }

    .form-fieldset { margin: 18px 0; padding: 20px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
    .form-fieldset legend { padding: 0 7px; font-weight: 700; }

    .number-field {
      width: 150px;
      margin-top: 8px;
      padding: 10px 12px;
      border: 1px solid #8a847d;
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }

    .choice-label { display: block; margin: 10px 0; line-height: 1.45; }
    .choice-label input { margin-right: 9px; accent-color: var(--accent); }

    .submit-spinner {
      width: 34px;
      height: 34px;
      margin: 24px auto;
      border: 4px solid #e4ddd6;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .jspsych-btn {
      min-width: 150px;
      margin: 24px 8px 0 !important;
      padding: 12px 24px !important;
      border: 1px solid var(--accent) !important;
      border-radius: 4px !important;
      background: var(--accent) !important;
      color: #fff !important;
      font-family: Georgia, "Times New Roman", serif !important;
      font-size: 16px !important;
      font-weight: 700 !important;
      letter-spacing: 0.01em;
      box-shadow: none !important;
      cursor: pointer;
      transition: background 120ms ease, transform 120ms ease;
    }

    .jspsych-btn:hover:not(:disabled) { background: var(--accent-dark) !important; transform: translateY(-1px); }
    .jspsych-btn:focus-visible { outline: 3px solid rgba(23, 105, 170, 0.45) !important; outline-offset: 3px; }
    .jspsych-btn:disabled { border-color: #aaa49d !important; background: #aaa49d !important; cursor: not-allowed; opacity: 0.72; }

    a { color: var(--accent); }
    a:focus-visible { outline: 3px solid rgba(23, 105, 170, 0.4); outline-offset: 3px; }

    @media (max-width: 700px) {
      #jspsych-content { width: min(100% - 22px, 800px); padding-top: 18px; }
      .paper-card, .scenario-card { padding: 26px 22px; }
      .study-facts { grid-template-columns: 1fr; }
      .study-fact { min-height: 0; }
      .slider-grid { grid-template-columns: 76px minmax(120px, 1fr) 76px; gap: 8px; }
      .rating-card { padding-left: 15px; padding-right: 15px; }
    }

    @media (max-width: 440px) {
      .slider-grid { grid-template-columns: 58px minmax(105px, 1fr) 58px; }
      .anchor { font-size: 10px; }
      .jspsych-btn { width: calc(100% - 16px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body></body>

<script>
"use strict";

// -----------------------------------------------------------------------------
// STUDY AND PLATFORM CONFIGURATION
// Replace the blank study-specific values only after they have been approved.
// -----------------------------------------------------------------------------
const CONFIG = Object.freeze({
  STUDY_ID: "less_credit_same_blame",
  EXPERIMENT_VERSION: "2.0.0",
  SCHEMA_VERSION: "1.0.0",
  N_SCENARIOS: 12,
  LETTER_OF_INFORMATION_URL: "",
  PROLIFIC_COMPLETION_CODE: "",
  DOWNLOAD_LOCAL_DATA_ON_FINISH: true,
  ALLOW_LIVE_TEST_MODE: false
});

const RUNNING_ON_PAVLOVIA =
  window.location.hostname.includes("pavlovia.org") ||
  window.location.hostname.includes("run.pavlovia.org");

const URL_PARAMS = new URLSearchParams(window.location.search);

function getUrlParam(name) {
  return URL_PARAMS.get(name) || "";
}

function makeRandomId(length = 12) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let value = "";
  for (let i = 0; i < length; i++) value += chars[Math.floor(Math.random() * chars.length)];
  return value;
}

function createRandomSeed() {
  const supplied = getUrlParam("seed");
  if (/^\d+$/.test(supplied)) return Number(supplied) >>> 0;
  if (window.crypto && window.crypto.getRandomValues) {
    const values = new Uint32Array(1);
    window.crypto.getRandomValues(values);
    return values[0];
  }
  return (Date.now() ^ Math.floor(Math.random() * 0xffffffff)) >>> 0;
}

function mulberry32(seed) {
  return function() {
    let t = seed += 0x6d2b79f5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(array, rng) {
  const copy = [...array];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function ensurePavloviaParameters() {
  if (!RUNNING_ON_PAVLOVIA) return false;
  const url = new URL(window.location.href);
  let changed = false;

  if (!url.searchParams.has("participant")) {
    url.searchParams.set("participant", getUrlParam("PROLIFIC_PID") || makeRandomId(16));
    changed = true;
  }
  if (!url.searchParams.has("session")) {
    url.searchParams.set("session", getUrlParam("SESSION_ID") || makeRandomId(16));
    changed = true;
  }
  if (changed) {
    window.location.replace(url.toString());
    return true;
  }
  return false;
}

const PROLIFIC_PID = getUrlParam("PROLIFIC_PID");
const PROLIFIC_STUDY_ID = getUrlParam("STUDY_ID");
const PROLIFIC_SESSION_ID = getUrlParam("SESSION_ID");
const PAVLOVIA_PARTICIPANT = getUrlParam("participant");
const PAVLOVIA_SESSION = getUrlParam("session");
const SESSION_ID = PROLIFIC_SESSION_ID || PAVLOVIA_SESSION || makeRandomId(18);
const RANDOMIZATION_SEED = createRandomSeed();
const RNG = mulberry32(RANDOMIZATION_SEED);

const COMPLETION_CODE_CONFIGURED =
  /^[A-Za-z0-9]+$/.test(CONFIG.PROLIFIC_COMPLETION_CODE) &&
  !CONFIG.PROLIFIC_COMPLETION_CODE.toUpperCase().includes("REPLACE");

const PROLIFIC_RETURN_URL = COMPLETION_CODE_CONFIGURED
  ? `https://app.prolific.com/submissions/complete?cc=${encodeURIComponent(CONFIG.PROLIFIC_COMPLETION_CODE)}`
  : "";

const TEST_MODE_REQUESTED = URL_PARAMS.has("test") || URL_PARAMS.has("nscenarios");
const TEST_MODE_ALLOWED = !RUNNING_ON_PAVLOVIA || CONFIG.ALLOW_LIVE_TEST_MODE;
const IS_TEST_MODE = TEST_MODE_REQUESTED && TEST_MODE_ALLOWED;

function requestedScenarioCount() {
  if (!IS_TEST_MODE) return CONFIG.N_SCENARIOS;
  const raw = getUrlParam("nscenarios") || getUrlParam("test");
  const parsed = Number.parseInt(raw, 10);
  return Math.min(CONFIG.N_SCENARIOS, Math.max(1, Number.isFinite(parsed) ? parsed : 2));
}

const N_SCENARIOS_PRESENTED = requestedScenarioCount();

function localCompletionScreen() {
  const display = jsPsych.getDisplayElement();
  if (!display) return;
  display.innerHTML = `
    <div class="study-wrap">
      <div class="paper-card centered">
        <div class="eyebrow">Local test complete</div>
        <h2>Thank you</h2>
        <p>The test data have been downloaded to this browser.</p>
        <p class="small muted">This local run did not send data to Pavlovia or redirect to Prolific.</p>
      </div>
    </div>`;
}

const jsPsych = initJsPsych({
  show_progress_bar: false,
  on_finish: function() {
    if (!RUNNING_ON_PAVLOVIA && CONFIG.DOWNLOAD_LOCAL_DATA_ON_FINISH) {
      const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
      jsPsych.data.get().localSave("csv", `LOCAL_${CONFIG.STUDY_ID}_${makeRandomId(8)}_${timestamp}.csv`);
      window.setTimeout(localCompletionScreen, 50);
    }
  }
});

jsPsych.data.addProperties({
  study_id: CONFIG.STUDY_ID,
  experiment_version: CONFIG.EXPERIMENT_VERSION,
  schema_version: CONFIG.SCHEMA_VERSION,
  jspsych_version: typeof jsPsych.version === "function" ? jsPsych.version() : "unknown",
  session_id: SESSION_ID,
  prolific_pid: PROLIFIC_PID,
  prolific_study_id: PROLIFIC_STUDY_ID,
  prolific_session_id: PROLIFIC_SESSION_ID,
  pavlovia_participant: PAVLOVIA_PARTICIPANT,
  pavlovia_session: PAVLOVIA_SESSION,
  randomization_seed: RANDOMIZATION_SEED,
  running_on_pavlovia: RUNNING_ON_PAVLOVIA,
  test_mode: IS_TEST_MODE,
  planned_n_scenarios: CONFIG.N_SCENARIOS,
  presented_n_scenarios: N_SCENARIOS_PRESENTED
});

// -----------------------------------------------------------------------------
// EXPERIMENTAL MATERIALS: 3 delegation conditions x 2 actor genders x 2 outcomes
// -----------------------------------------------------------------------------
const TASKS = [
  {id:"report", label:"Organizational report", object:"report", intro:"preparing a report summarizing the progress of several projects within the organization", action:"gathers the relevant information, analyzes it, and prepares the report", success:"The final report is accurate and complete and receives a very positive evaluation from the manager.", failure:"The final report contains several important inaccuracies and receives a negative evaluation from the manager."},
  {id:"presentation", label:"Survey presentation", object:"presentation", intro:"preparing a presentation summarizing the results of a recent customer survey", action:"reviews the survey results, decides which findings to include, and prepares the presentation", success:"The final presentation accurately represents the survey results and receives a very positive evaluation.", failure:"The final presentation misrepresents several important survey results and receives a negative evaluation."},
  {id:"employee_feedback", label:"Employee feedback summary", object:"summary", intro:"preparing a summary of feedback collected from employees about their workplace experiences", action:"reads the feedback, identifies the major themes, and prepares the summary", success:"The final summary accurately reflects the employee feedback and receives a positive evaluation.", failure:"The final summary incorrectly represents several important themes in the employee feedback and receives a negative evaluation."},
  {id:"training_guide", label:"Training guide", object:"training guide", intro:"preparing a training guide for new employees joining the organization", action:"gathers the necessary information, organizes the material, and prepares the training guide", success:"The final training guide is clear, accurate, and receives a positive evaluation.", failure:"The final training guide contains several important pieces of incorrect information and receives a negative evaluation."},
  {id:"project_brief", label:"Project brief", object:"briefing document", intro:"preparing a briefing document about an upcoming organizational project", action:"reviews the available information, identifies the key issues, and prepares the briefing document", success:"The briefing document accurately identifies the important issues and receives a positive evaluation.", failure:"The briefing document contains several important inaccuracies and receives a negative evaluation."},
  {id:"customer_feedback", label:"Customer feedback report", object:"report", intro:"preparing a report summarizing customer comments about a recently introduced service", action:"reviews the comments, identifies recurring themes, and prepares the report", success:"The final report accurately summarizes the customer feedback and receives a positive evaluation.", failure:"The final report incorrectly summarizes several important aspects of the customer feedback and receives a negative evaluation."},
  {id:"meeting_brief", label:"Meeting brief", object:"briefing document", intro:"preparing a briefing document for an important upcoming meeting", action:"reviews the relevant materials, identifies the most important information, and prepares the briefing document", success:"The briefing accurately communicates the relevant information and receives a positive evaluation.", failure:"The briefing contains several important inaccuracies and receives a negative evaluation."},
  {id:"faq", label:"FAQ document", object:"FAQ document", intro:"preparing a document answering frequently asked questions about a new organizational procedure", action:"researches the procedure, identifies the relevant information, and prepares the document", success:"The final document provides accurate answers and receives a positive evaluation.", failure:"The final document provides incorrect information in several important answers and receives a negative evaluation."},
  {id:"project_plan", label:"Project plan", object:"project plan", intro:"preparing a written project plan describing the tasks and deadlines for an upcoming project", action:"reviews the project requirements, identifies the necessary tasks and deadlines, and prepares the plan", success:"The final project plan accurately identifies the necessary tasks and deadlines and receives a positive evaluation.", failure:"The final project plan contains several important errors in the tasks or deadlines and receives a negative evaluation."},
  {id:"policy_summary", label:"Policy summary", object:"summary", intro:"preparing a short summary explaining a new organizational policy to other employees", action:"reads the policy, identifies the important information, and prepares the summary", success:"The final summary accurately explains the policy and receives a positive evaluation.", failure:"The final summary incorrectly explains several important parts of the policy and receives a negative evaluation."},
  {id:"stakeholder_update", label:"Stakeholder update", object:"written update", intro:"preparing a written update explaining the progress of a project to people involved in the project", action:"gathers the relevant information, decides what should be included, and prepares the update", success:"The final update accurately communicates the project progress and receives a positive evaluation.", failure:"The final update contains several important inaccuracies about the project progress and receives a negative evaluation."},
  {id:"info_summary", label:"Information summary", object:"summary document", intro:"preparing a short document summarizing information from several sources for the organization", action:"reads the sources, identifies the important information, and prepares the summary", success:"The final document accurately summarizes the relevant information and receives a positive evaluation.", failure:"The final document contains several important inaccuracies and receives a negative evaluation."}
];

const NAMES = {
  man: ["Daniel", "Michael", "Matthew", "Andrew", "Thomas", "James"],
  woman: ["Danielle", "Michelle", "Emma", "Sarah", "Hannah", "Jessica"]
};

const CONDITIONS = [];
for (const delegation of ["solo", "human", "llm"]) {
  for (const actorGender of ["man", "woman"]) {
    for (const outcome of ["success", "failure"]) {
      CONDITIONS.push({ delegation, actor_gender: actorGender, outcome });
    }
  }
}

function buildTrials() {
  const conditionOrder = shuffle(CONDITIONS, RNG);
  const taskOrder = shuffle(TASKS, RNG);
  const names = { man: shuffle(NAMES.man, RNG), woman: shuffle(NAMES.woman, RNG) };
  const nameIndex = { man: 0, woman: 0 };

  return conditionOrder.map((condition, index) => {
    const actorGender = condition.actor_gender;
    const trial = {
      ...condition,
      task: taskOrder[index],
      name: names[actorGender][nameIndex[actorGender]],
      full_order_index: index + 1
    };
    nameIndex[actorGender] += 1;
    trial.condition_cell = `${trial.delegation}_${trial.actor_gender}_${trial.outcome}`;
    return trial;
  });
}

function validateFullDesign(trials) {
  const cells = new Set(trials.map(trial => trial.condition_cell));
  const tasks = new Set(trials.map(trial => trial.task.id));
  const maleNames = new Set(trials.filter(trial => trial.actor_gender === "man").map(trial => trial.name));
  const femaleNames = new Set(trials.filter(trial => trial.actor_gender === "woman").map(trial => trial.name));
  if (trials.length !== 12 || cells.size !== 12 || tasks.size !== 12 || maleNames.size !== 6 || femaleNames.size !== 6) {
    throw new Error("The generated experiment does not contain the intended balanced 3 x 2 x 2 design.");
  }
}

const FULL_TRIALS = buildTrials();
validateFullDesign(FULL_TRIALS);
const TRIALS = FULL_TRIALS.slice(0, N_SCENARIOS_PRESENTED);

// -----------------------------------------------------------------------------
// SHARED PARTICIPANT-FACING COMPONENTS
// -----------------------------------------------------------------------------
function prototypeNote() {
  const missing = [];
  if (!CONFIG.LETTER_OF_INFORMATION_URL) missing.push("approved Letter of Information URL");
  if (!COMPLETION_CODE_CONFIGURED) missing.push("Prolific completion code");
  if (missing.length === 0 && !IS_TEST_MODE) return "";
  const details = [];
  if (missing.length) details.push(`Before launch, configure: ${missing.join(" and ")}.`);
  if (IS_TEST_MODE) details.push(`Local test mode is showing ${N_SCENARIOS_PRESENTED} of ${CONFIG.N_SCENARIOS} scenarios.`);
  return `<div class="prototype-note"><strong>Researcher preview:</strong> ${details.join(" ")}</div>`;
}

function progressHTML(index, phase) {
  const offset = phase === "ratings" ? 0.5 : 0;
  const percent = Math.min(100, ((index + offset) / N_SCENARIOS_PRESENTED) * 100);
  return `
    <div class="progress-wrap" aria-label="Study progress">
      <div class="progress-track" aria-hidden="true"><div class="progress-fill" style="width:${percent.toFixed(1)}%"></div></div>
      <div class="progress-label">Scenario ${index + 1} of ${N_SCENARIOS_PRESENTED}</div>
    </div>`;
}

function actorPronouns(gender) {
  return gender === "man"
    ? { subject: "he", reflexive: "himself" }
    : { subject: "she", reflexive: "herself" };
}

function makeVignetteHTML(trial, index) {
  const pronouns = actorPronouns(trial.actor_gender);
  const task = trial.task;
  let workDescription;

  if (trial.delegation === "solo") {
    workDescription = `${trial.name} ${task.action}. ${trial.name} completes all parts of the task personally and prepares the final ${task.object} ${pronouns.reflexive}.`;
  } else if (trial.delegation === "human") {
    workDescription = `${trial.name} completes most of the task but asks a colleague to complete approximately one-third of the work. ${trial.name} reviews the colleague's work, makes any edits ${pronouns.subject} thinks are necessary, and incorporates it into the final ${task.object}.`;
  } else {
    workDescription = `${trial.name} completes most of the task but asks a large language model, such as ChatGPT, to complete approximately one-third of the work. ${trial.name} reviews the model's output, makes any edits ${pronouns.subject} thinks are necessary, and incorporates it into the final ${task.object}.`;
  }

  const outcomeText = trial.outcome === "success" ? task.success : task.failure;
  return `
    <div class="study-wrap">
      ${progressHTML(index, "vignette")}
      <article class="scenario-card">
        <div class="eyebrow">Workplace scenario</div>
        <h2>${task.label}</h2>
        <div class="scenario-text">
          <p>${trial.name} is responsible for ${task.intro}.</p>
          <p>${workDescription}</p>
        </div>
        <div class="outcome-panel">
          <span class="outcome-label">Manager's evaluation</span>
          ${outcomeText}
        </div>
      </article>
    </div>`;
}

function sliderHTML(name, prompt, leftAnchor, rightAnchor, index) {
  const inputId = `rating-${index}-${name}`;
  return `
    <div class="rating-card" data-rating-card="${name}">
      <label class="rating-question" for="${inputId}">${prompt}</label>
      <div class="slider-grid">
        <div class="anchor"><strong>0</strong><br>${leftAnchor}</div>
        <div class="slider-control">
          <input id="${inputId}" type="range" min="0" max="100" step="1" value="50" name="${name}" data-rating-slider="${name}" required>
          <div class="live-value" data-rating-value="${name}" aria-live="polite">&mdash;</div>
        </div>
        <div class="anchor right"><strong>100</strong><br>${rightAnchor}</div>
      </div>
    </div>`;
}

function makeRatingHTML(trial, index) {
  const primary = trial.outcome === "success"
    ? sliderHTML("primary_credit", `How much credit does <strong>${trial.name}</strong> deserve for the quality of the final outcome?`, "No credit at all", "All of the credit", index)
    : sliderHTML("primary_responsibility", `How responsible is <strong>${trial.name}</strong> for the problems with the final outcome?`, "Not at all responsible", "Completely responsible", index);

  const additional = [
    sliderHTML("personal_contribution", `How much did <strong>${trial.name}</strong> personally contribute to the final work?`, "None", "All of it", index),
    sliderHTML("effort", `How much effort did <strong>${trial.name}</strong> personally put into completing the task?`, "No effort", "A great deal of effort", index),
    sliderHTML("competence", `How competent does <strong>${trial.name}</strong> appear to be at this type of task?`, "Not at all competent", "Extremely competent", index),
    sliderHTML("control", `How much control did <strong>${trial.name}</strong> have over the quality of the final outcome?`, "No control", "Complete control", index)
  ].join("");

  let delegate = "";
  if (trial.delegation !== "solo") {
    const helper = trial.delegation === "human" ? "the colleague" : "the large language model";
    delegate = trial.outcome === "success"
      ? `<div class="rating-section-label">The other contributor</div>${sliderHTML("delegate_credit", `How much credit does <strong>${helper}</strong> deserve for the final outcome?`, "No credit at all", "All of the credit", index)}`
      : `<div class="rating-section-label">The other contributor</div>${sliderHTML("delegate_responsibility", `How responsible is <strong>${helper}</strong> for the problems with the final outcome?`, "Not at all responsible", "Completely responsible", index)}`;
  }

  return `
    <div class="rating-instructions">Please move every slider before continuing. The number below each slider shows your selected response.</div>
    <div class="rating-section-label">Your main judgment</div>
    ${primary}
    <div class="rating-section-label">Additional impressions</div>
    ${additional}
    ${delegate}
    <div id="rating-completion" class="completion-status" aria-live="polite"></div>`;
}

function bindRequiredSliders() {
  const sliders = Array.from(document.querySelectorAll("[data-rating-slider]"));
  const submitButton = document.querySelector(".jspsych-btn");
  const status = document.getElementById("rating-completion");
  if (!submitButton || sliders.length === 0) return;

  submitButton.disabled = true;
  submitButton.setAttribute("aria-disabled", "true");

  function refreshStatus() {
    const completed = sliders.filter(slider => slider.dataset.touched === "true").length;
    const remaining = sliders.length - completed;
    if (remaining === 0) {
      submitButton.disabled = false;
      submitButton.removeAttribute("aria-disabled");
      if (status) status.textContent = "All ratings complete. You can continue.";
    } else if (status) {
      status.textContent = `${remaining} rating${remaining === 1 ? "" : "s"} remaining.`;
    }
  }

  for (const slider of sliders) {
    slider.dataset.touched = "false";
    slider.addEventListener("input", function() {
      slider.dataset.touched = "true";
      const value = document.querySelector(`[data-rating-value="${slider.dataset.ratingSlider}"]`);
      const card = slider.closest("[data-rating-card]");
      if (value) value.textContent = slider.value;
      if (card) card.classList.add("touched");
      refreshStatus();
    });
  }
  refreshStatus();
}

const RATING_FIELDS = [
  "primary_credit", "primary_responsibility", "personal_contribution", "effort",
  "competence", "control", "delegate_credit", "delegate_responsibility"
];

function normalizeRatingData(data) {
  const response = data.response || {};
  for (const field of RATING_FIELDS) {
    data[field] = Object.prototype.hasOwnProperty.call(response, field) ? Number(response[field]) : null;
  }
  data.rating_interactions_required = Object.keys(response).length;
  data.rating_interactions_completed = Object.keys(response).length;
}

function trialMetadata(trial, index, role) {
  return {
    trial_role: role,
    scenario_index: index + 1,
    full_order_index: trial.full_order_index,
    task_id: trial.task.id,
    task_label: trial.task.label,
    condition_cell: trial.condition_cell,
    delegation: trial.delegation,
    actor_gender: trial.actor_gender,
    actor_name: trial.name,
    outcome: trial.outcome,
    delegate_type: trial.delegation === "human" ? "colleague" : trial.delegation === "llm" ? "llm" : "none"
  };
}

// -----------------------------------------------------------------------------
// CONSENT, INSTRUCTIONS, DEMOGRAPHICS, AND COMPLETION
// -----------------------------------------------------------------------------
function consentHTML() {
  const informationSheet = CONFIG.LETTER_OF_INFORMATION_URL
    ? `<p>Please read the <a href="${CONFIG.LETTER_OF_INFORMATION_URL}" target="_blank" rel="noopener noreferrer">Letter of Information</a> before deciding whether to participate. It will open in a new tab.</p>`
    : `<div class="setup-warning"><strong>Setup required:</strong> Add this study's approved Letter of Information and final consent language before recruitment.</div>`;

  return `
    <div class="study-wrap">
      ${prototypeNote()}
      <div class="paper-card">
        <div class="eyebrow">Before you begin</div>
        <h2>Information Sheet and Consent Form</h2>
        ${informationSheet}
        <div class="consent-copy">
          <p><strong>Purpose.</strong> This study examines how people evaluate work completed in workplace settings.</p>
          <p><strong>What you will do.</strong> You will read 12 independent workplace scenarios and answer questions about the person described in each scenario. You will then answer a small number of demographic questions.</p>
          <p><strong>Voluntary participation.</strong> Taking part is voluntary. You may stop at any time by closing this page. The approved study materials must specify withdrawal procedures, risks, benefits, compensation, confidentiality, data use, and researcher contact details.</p>
        </div>
        <label class="consent-label">
          <input type="checkbox" name="consent_participate" value="yes" required>
          <span>I have read the information provided for this study, I am at least 18 years old, and I consent to participate.</span>
        </label>
        <p class="small muted">If you do not consent, close this page and use the non-consent return path specified by the researcher.</p>
      </div>
    </div>`;
}

const consentPage = {
  type: jsPsychSurveyHtmlForm,
  html: consentHTML,
  button_label: "I consent — continue",
  data: { trial_role: "consent" },
  on_finish: function(data) {
    data.consent_participate = data.response && data.response.consent_participate === "yes";
  }
};

const welcomePage = {
  type: jsPsychHtmlButtonResponse,
  stimulus: function() {
    return `
      <div class="study-wrap">
        ${prototypeNote()}
        <div class="paper-card">
          <div class="eyebrow">Workplace evaluation study</div>
          <h1>Welcome</h1>
          <p class="lead">In this study, you will read a series of brief workplace scenarios and evaluate the person described in each one.</p>
          <div class="study-facts">
            <div class="study-fact"><strong>Scenarios</strong>${N_SCENARIOS_PRESENTED} independent workplace situations</div>
            <div class="study-fact"><strong>Your task</strong>Read each scenario carefully</div>
            <div class="study-fact"><strong>Your responses</strong>Rate your impression on several scales</div>
          </div>
          <p class="small muted">There are no correct answers. We are interested in your own judgment.</p>
        </div>
      </div>`;
  },
  choices: ["Continue"],
  data: { trial_role: "welcome" }
};

const instructionsPage = {
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <div class="study-wrap">
      <div class="paper-card">
        <div class="eyebrow">Instructions</div>
        <h2>How the study works</h2>
        <ul class="instruction-list">
          <li>Treat every scenario as a <strong>different person</strong> completing a <strong>different workplace task</strong>.</li>
          <li>Read the full scenario, including the manager's evaluation of the finished work.</li>
          <li>On the following page, move every slider to record your judgment.</li>
          <li>Use the full 0–100 scale whenever it reflects your view.</li>
        </ul>
        <p class="small muted" style="margin-top:24px;">Please complete the study in one sitting and avoid using the browser's Back or Refresh controls.</p>
      </div>
    </div>`,
  choices: ["Begin scenarios"],
  data: { trial_role: "instructions" }
};

function demographicsHTML() {
  return `
    <div class="study-wrap">
      <div class="paper-card compact">
        <div class="eyebrow">Final questions</div>
        <h2>About you</h2>
        <p class="muted">Please answer the following questions.</p>
        <fieldset class="form-fieldset">
          <legend>Age</legend>
          <label for="participant-age">Your age in years</label><br>
          <input class="number-field" id="participant-age" name="age" type="number" min="18" max="100" step="1" required autocomplete="off">
        </fieldset>
        <fieldset class="form-fieldset">
          <legend>Gender</legend>
          <label class="choice-label"><input type="radio" name="participant_gender" value="man" required>Man</label>
          <label class="choice-label"><input type="radio" name="participant_gender" value="woman">Woman</label>
          <label class="choice-label"><input type="radio" name="participant_gender" value="nonbinary">Non-binary</label>
          <label class="choice-label"><input type="radio" name="participant_gender" value="another_gender">Another gender</label>
          <label class="choice-label"><input type="radio" name="participant_gender" value="prefer_not_to_say">Prefer not to say</label>
        </fieldset>
        <fieldset class="form-fieldset">
          <legend>Use of large language models</legend>
          <p>How often do you use tools such as ChatGPT, Claude, or Gemini?</p>
          <label class="choice-label"><input type="radio" name="llm_frequency" value="never" required>Never</label>
          <label class="choice-label"><input type="radio" name="llm_frequency" value="less_than_monthly">Less than monthly</label>
          <label class="choice-label"><input type="radio" name="llm_frequency" value="monthly">Monthly</label>
          <label class="choice-label"><input type="radio" name="llm_frequency" value="weekly">Weekly</label>
          <label class="choice-label"><input type="radio" name="llm_frequency" value="daily_or_almost_daily">Daily or almost daily</label>
        </fieldset>
      </div>
    </div>`;
}

const demographicsPage = {
  type: jsPsychSurveyHtmlForm,
  html: demographicsHTML,
  button_label: "Continue",
  data: { trial_role: "demographics" },
  on_finish: function(data) {
    const response = data.response || {};
    data.age = response.age === undefined ? null : Number(response.age);
    data.participant_gender = response.participant_gender || null;
    data.llm_frequency = response.llm_frequency || null;
  }
};

function finalButtonLabel() {
  if (!RUNNING_ON_PAVLOVIA) return "Finish and download test data";
  if (PROLIFIC_RETURN_URL) return "Finish and return to Prolific";
  return "Finish and submit responses";
}

const finalPage = {
  type: jsPsychHtmlButtonResponse,
  stimulus: function() {
    const destination = RUNNING_ON_PAVLOVIA
      ? "Your responses will now be securely submitted. Keep this page open until submission is complete."
      : "This local test will download a CSV file. No data will be sent to Pavlovia or Prolific.";
    return `
      <div class="study-wrap">
        ${prototypeNote()}
        <div class="paper-card centered">
          <div class="eyebrow">Questions complete</div>
          <h2>Thank you for taking part</h2>
          <p>${destination}</p>
          <p class="small muted">Click the button below once and wait for the next page.</p>
        </div>
      </div>`;
  },
  choices: [finalButtonLabel()],
  data: { trial_role: "final_confirmation", study_complete: true },
  on_load: function() {
    const button = document.querySelector(".jspsych-btn");
    if (!button) return;
    button.addEventListener("click", function() {
      button.textContent = "Finishing…";
      // Defer disabling until after the form's default submit action has fired.
      window.setTimeout(function() { button.disabled = true; }, 0);
    }, { once: true });
  }
};

function makePavloviaInit() {
  return { type: jsPsychPavlovia, command: "init", data: { trial_role: "pavlovia_init" } };
}

function makePavloviaFinish() {
  return {
    type: jsPsychPavlovia,
    command: "finish",
    data: { trial_role: "pavlovia_finish" },
    on_load: function() {
      const display = jsPsych.getDisplayElement();
      if (!display) return;
      display.innerHTML = `
        <div class="study-wrap">
          <div class="paper-card centered" aria-live="polite">
            <div class="eyebrow">Submitting responses</div>
            <h2>Please keep this page open</h2>
            <div class="submit-spinner" aria-hidden="true"></div>
            <p>Your responses are being uploaded. This may take a few moments.</p>
            <p class="small muted">Do not close or refresh this page.</p>
            ${PROLIFIC_RETURN_URL ? `<p id="manual-return" class="small" style="display:none;margin-top:28px;">If submission has finished but the page does not advance, <a href="${PROLIFIC_RETURN_URL}">return to Prolific</a>.</p>` : ""}
          </div>
        </div>`;
      if (PROLIFIC_RETURN_URL) {
        window.setTimeout(function() {
          const link = document.getElementById("manual-return");
          if (link) link.style.display = "block";
        }, 20000);
      }
    },
    on_finish: function() {
      if (PROLIFIC_RETURN_URL) {
        window.location.assign(PROLIFIC_RETURN_URL);
        return;
      }
      const display = jsPsych.getDisplayElement();
      if (display) {
        display.innerHTML = `
          <div class="study-wrap">
            <div class="paper-card centered">
              <div class="eyebrow">Submission complete</div>
              <h2>Your responses have been recorded</h2>
              <p>You may now close this page.</p>
              <p class="small muted">Researcher setup note: configure the Prolific completion code before recruitment.</p>
            </div>
          </div>`;
      }
    }
  };
}

// -----------------------------------------------------------------------------
// TIMELINE ASSEMBLY
// -----------------------------------------------------------------------------
function buildTimeline() {
  const timeline = [];
  if (RUNNING_ON_PAVLOVIA) timeline.push(makePavloviaInit());
  timeline.push(consentPage, welcomePage, instructionsPage);

  TRIALS.forEach(function(trial, index) {
    timeline.push({
      type: jsPsychHtmlButtonResponse,
      stimulus: function() { return makeVignetteHTML(trial, index); },
      choices: ["Continue to questions"],
      data: trialMetadata(trial, index, "vignette")
    });
    timeline.push({
      type: jsPsychSurveyHtmlForm,
      preamble: function() {
        return `
          <div class="study-wrap ratings-header">
            ${progressHTML(index, "ratings")}
            <div class="paper-card compact">
              <div class="eyebrow">Your judgment</div>
              <h2>Thinking about ${trial.name}</h2>
              <p class="muted">Base each response on the scenario you just read.</p>
            </div>
          </div>`;
      },
      html: function() { return `<div class="study-wrap">${makeRatingHTML(trial, index)}</div>`; },
      button_label: "Continue",
      on_load: bindRequiredSliders,
      data: trialMetadata(trial, index, "ratings"),
      on_finish: normalizeRatingData
    });
  });

  timeline.push(demographicsPage, finalPage);
  if (RUNNING_ON_PAVLOVIA) timeline.push(makePavloviaFinish());
  return timeline;
}

function startExperiment() {
  if (ensurePavloviaParameters()) return;
  jsPsych.run(buildTimeline());
}

window.addEventListener("load", startExperiment);
</script>
</html>
