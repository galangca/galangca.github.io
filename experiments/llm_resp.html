<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workplace Evaluation Study</title>

  <script src="https://unpkg.com/jspsych@8.3.0"></script>
  <link href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" rel="stylesheet">

  <!-- Official Pavlovia bridge used by the reference study and Pavlovia's jsPsych guide. -->
  <script src="https://pavlovia.org/lib/jspsych-7-pavlovia-2022.1.1.js"></script>

  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@2.1.0"></script>

  <style>
    :root {
      --accent: #7a003c;
      --accent-dark: #5a002c;
      --accent-soft: #f5eaf0;
      --ink: #24211f;
      --muted: #706b66;
      --line: #ded9d1;
      --paper: #fffefb;
      --canvas: #f7f5ef;
      --soft: #f1eee7;
      --shadow: 0 14px 38px rgba(54, 42, 34, 0.08);
    }

    * { box-sizing: border-box; }
    html { background: var(--canvas); }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(122, 0, 60, 0.045), transparent 30rem),
        var(--canvas);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    .jspsych-display-element {
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      line-height: 1.6;
    }

    #jspsych-content {
      width: min(100% - 32px, 1200px);
      max-width: 1200px;
      margin: 0 auto;
      padding: 34px 0 54px;
    }

    .study-wrap { width: 100%; max-width: 800px; margin: 0 auto; text-align: left; }
    .study-wrap.split { max-width: none; }

    .split-layout {
      display: grid;
      grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
      gap: 28px;
      align-items: start;
    }

    .split-scenario {
      position: sticky;
      top: 20px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
    }

    .split-scenario .scenario-card { padding: 28px 30px; }
    .split-scenario .scenario-text { font-size: 17px; line-height: 1.7; }
    .split-questions .rating-instructions { margin-top: 0; }
    .split-questions .jspsych-btn { display: block; margin: 24px auto 0 !important; }

    @media (max-width: 960px) {
      .split-layout { grid-template-columns: 1fr; gap: 18px; }
      .split-scenario { position: static; max-height: none; overflow: visible; }
    }

    .paper-card {
      width: 100%;
      padding: 38px 44px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .paper-card.compact { padding-top: 32px; padding-bottom: 32px; }
    .paper-card.centered { text-align: center; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1, h2, h3 { color: var(--ink); font-weight: 400; }
    h1 { margin: 0 0 16px; font-size: clamp(30px, 5vw, 42px); line-height: 1.12; }
    h2 { margin: 0 0 18px; font-size: 26px; line-height: 1.25; }
    h3 { margin: 0 0 10px; font-size: 19px; }
    p { margin: 12px 0; }

    .lead { font-size: 19px; line-height: 1.65; }
    .muted { color: var(--muted); }
    .small { font-size: 14px; }

    .prototype-note,
    .setup-warning {
      margin: 0 0 18px;
      padding: 12px 15px;
      border: 1px solid #e6c9d7;
      border-left: 4px solid var(--accent);
      border-radius: 4px;
      background: #fff8fb;
      color: #5f1839;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      line-height: 1.45;
    }

    .study-facts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 26px 0;
    }

    .study-fact {
      min-height: 100px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }

    .study-fact strong {
      display: block;
      margin-bottom: 5px;
      color: var(--accent);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .instruction-list { margin: 20px 0 0; padding-left: 22px; }
    .instruction-list li { margin: 10px 0; padding-left: 5px; }

    .consent-copy {
      max-height: 300px;
      overflow-y: auto;
      margin: 20px 0;
      padding: 20px 22px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #fbfaf7;
      font-size: 15px;
    }

    .consent-copy p:first-child { margin-top: 0; }
    .consent-copy p:last-child { margin-bottom: 0; }

    .consent-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 18px 0 0;
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #fff;
      font-size: 15px;
      line-height: 1.45;
    }

    .consent-label input { flex: 0 0 auto; margin-top: 4px; accent-color: var(--accent); }

    .progress-wrap { width: 100%; margin: 0 0 18px; }
    .progress-track { width: 100%; height: 7px; overflow: hidden; border-radius: 999px; background: #e7e2da; }
    .progress-fill { height: 100%; border-radius: inherit; background: var(--accent); transition: width 180ms ease; }
    .progress-label { margin-top: 6px; color: var(--muted); font-family: Arial, Helvetica, sans-serif; font-size: 12px; text-align: right; }

    .scenario-card {
      padding: 34px 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .scenario-card h2 { margin-bottom: 24px; color: var(--accent); }
    .scenario-text { font-size: 18px; line-height: 1.75; }

    .outcome-panel {
      margin-top: 24px;
      padding: 17px 20px;
      border-left: 4px solid var(--accent);
      border-radius: 0 5px 5px 0;
      background: var(--soft);
      line-height: 1.6;
    }

    .outcome-label {
      display: block;
      margin-bottom: 5px;
      color: var(--accent);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .ratings-header { margin-bottom: 18px; }

    .rating-instructions {
      margin: 14px 0 20px;
      padding: 12px 15px;
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
      color: #4f1832;
      font-size: 14px;
    }

    .rating-section-label {
      margin: 28px 0 10px;
      color: var(--accent);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .likert-item {
      min-width: 0;
      margin: 12px 0;
      padding: 18px 20px 16px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }

    /* Floating the legend keeps it inside the box instead of on the fieldset border. */
    .likert-question {
      float: left;
      width: 100%;
      margin: 0 0 14px;
      padding: 0;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
    }

    .likert-scale {
      clear: both;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }

    .likert-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 8px 4px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #faf9f6;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      line-height: 1.25;
      text-align: center;
      cursor: pointer;
    }

    .likert-option input { margin: 0; accent-color: var(--accent); }
    .likert-num { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .likert-option:hover { border-color: #c6a0b3; }
    .likert-option:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-dark); font-weight: 700; }
    .likert-option:has(input:focus-visible) { outline: 3px solid rgba(23, 105, 170, 0.35); outline-offset: 2px; }

    .likert-item.answered { border-color: #c6a0b3; background: #fffcfd; }
    .likert-item.missing { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
    .likert-item:focus { outline: none; }
    .likert-item:focus-visible { outline: 3px solid rgba(23, 105, 170, 0.35); outline-offset: 2px; }
    .split-scenario:focus-visible { outline: 3px solid rgba(23, 105, 170, 0.35); outline-offset: 3px; border-radius: 8px; }

    .completion-status {
      min-height: 22px;
      margin: 15px 0 0;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      text-align: center;
    }

    .form-fieldset { margin: 18px 0; padding: 20px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
    .form-fieldset legend { padding: 0 7px; font-weight: 700; }

    .number-field {
      width: 150px;
      margin-top: 8px;
      padding: 10px 12px;
      border: 1px solid #8a847d;
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }

    .text-field {
      width: 100%;
      min-height: 110px;
      margin-top: 8px;
      padding: 10px 12px;
      border: 1px solid #8a847d;
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      resize: vertical;
    }

    .choice-label { display: block; margin: 10px 0; line-height: 1.45; }
    .choice-label input { margin-right: 9px; accent-color: var(--accent); }
    .choice-list { clear: both; }
    .est-text { margin: 0 0 12px; }
    .est-text:last-child { margin-bottom: 0; }

    .submit-spinner {
      width: 34px;
      height: 34px;
      margin: 24px auto;
      border: 4px solid #e4ddd6;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .jspsych-btn {
      min-width: 150px;
      margin: 24px 8px 0 !important;
      padding: 12px 24px !important;
      border: 1px solid var(--accent) !important;
      border-radius: 4px !important;
      background: var(--accent) !important;
      color: #fff !important;
      font-family: Georgia, "Times New Roman", serif !important;
      font-size: 16px !important;
      font-weight: 700 !important;
      letter-spacing: 0.01em;
      box-shadow: none !important;
      cursor: pointer;
      transition: background 120ms ease, transform 120ms ease;
    }

    .jspsych-btn:hover:not(:disabled) { background: var(--accent-dark) !important; transform: translateY(-1px); }
    .jspsych-btn:focus-visible { outline: 3px solid rgba(23, 105, 170, 0.45) !important; outline-offset: 3px; }
    .jspsych-btn:disabled { border-color: #aaa49d !important; background: #aaa49d !important; cursor: not-allowed; opacity: 0.72; }
    .jspsych-btn.secondary { background: #fff !important; color: var(--accent) !important; }
    .jspsych-btn.secondary:hover { background: var(--accent-soft) !important; }
    .consent-actions { text-align: center; }

    a { color: var(--accent); }
    a:focus-visible { outline: 3px solid rgba(23, 105, 170, 0.4); outline-offset: 3px; }

    @media (max-width: 700px) {
      #jspsych-content { width: min(100% - 22px, 800px); padding-top: 18px; }
      .paper-card, .scenario-card { padding: 26px 22px; }
      .study-facts { grid-template-columns: 1fr; }
      .study-fact { min-height: 0; }
      .likert-item { padding-left: 15px; padding-right: 15px; }
      .likert-scale { grid-template-columns: 1fr; gap: 5px; }
      .likert-option { flex-direction: row; gap: 10px; padding: 9px 12px; font-size: 14px; text-align: left; }
      .likert-num { min-width: 1em; }
    }

    @media (max-width: 440px) {
      .jspsych-btn { width: calc(100% - 16px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body></body>

<script>
"use strict";

// -----------------------------------------------------------------------------
// STUDY AND PLATFORM CONFIGURATION
// Replace the blank study-specific values only after they have been approved.
// -----------------------------------------------------------------------------
const CONFIG = Object.freeze({
  STUDY_ID: "less_credit_same_blame",
  EXPERIMENT_VERSION: "5.4.0",
  SCHEMA_VERSION: "4.2.0",
  N_SCENARIOS: 12,
  LETTER_OF_INFORMATION_URL: "",
  PROLIFIC_COMPLETION_CODE: "",
  PROLIFIC_NOCONSENT_CODE: "",
  DOWNLOAD_LOCAL_DATA_ON_FINISH: true,
  ALLOW_LIVE_TEST_MODE: false
});

const RUNNING_ON_PAVLOVIA =
  window.location.hostname.includes("pavlovia.org") ||
  window.location.hostname.includes("run.pavlovia.org");

const URL_PARAMS = new URLSearchParams(window.location.search);

function getUrlParam(name) {
  return URL_PARAMS.get(name) || "";
}

function makeRandomId(length = 12) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let value = "";
  for (let i = 0; i < length; i++) value += chars[Math.floor(Math.random() * chars.length)];
  return value;
}

function createRandomSeed() {
  const supplied = getUrlParam("seed");
  if (/^\d+$/.test(supplied)) return Number(supplied) >>> 0;
  if (window.crypto && window.crypto.getRandomValues) {
    const values = new Uint32Array(1);
    window.crypto.getRandomValues(values);
    return values[0];
  }
  return (Date.now() ^ Math.floor(Math.random() * 0xffffffff)) >>> 0;
}

function mulberry32(seed) {
  return function() {
    let t = seed += 0x6d2b79f5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(array, rng) {
  const copy = [...array];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function ensurePavloviaParameters() {
  if (!RUNNING_ON_PAVLOVIA) return false;
  const url = new URL(window.location.href);
  let changed = false;

  if (!url.searchParams.has("participant")) {
    url.searchParams.set("participant", getUrlParam("PROLIFIC_PID") || makeRandomId(16));
    changed = true;
  }
  if (!url.searchParams.has("session")) {
    url.searchParams.set("session", getUrlParam("SESSION_ID") || makeRandomId(16));
    changed = true;
  }
  if (changed) {
    window.location.replace(url.toString());
    return true;
  }
  return false;
}

const PROLIFIC_PID = getUrlParam("PROLIFIC_PID");
const PROLIFIC_STUDY_ID = getUrlParam("STUDY_ID");
const PROLIFIC_SESSION_ID = getUrlParam("SESSION_ID");
const PAVLOVIA_PARTICIPANT = getUrlParam("participant");
const PAVLOVIA_SESSION = getUrlParam("session");
const SESSION_ID = PROLIFIC_SESSION_ID || PAVLOVIA_SESSION || makeRandomId(18);
const RANDOMIZATION_SEED = createRandomSeed();
const RNG = mulberry32(RANDOMIZATION_SEED);

function isProlificCode(code) {
  return /^[A-Za-z0-9]+$/.test(code) && !code.toUpperCase().includes("REPLACE");
}

function prolificReturnURL(code) {
  return isProlificCode(code)
    ? `https://app.prolific.com/submissions/complete?cc=${encodeURIComponent(code)}`
    : "";
}

const COMPLETION_CODE_CONFIGURED = isProlificCode(CONFIG.PROLIFIC_COMPLETION_CODE);
const NOCONSENT_CODE_CONFIGURED = isProlificCode(CONFIG.PROLIFIC_NOCONSENT_CODE);
const PROLIFIC_RETURN_URL = prolificReturnURL(CONFIG.PROLIFIC_COMPLETION_CODE);
const PROLIFIC_NOCONSENT_URL = prolificReturnURL(CONFIG.PROLIFIC_NOCONSENT_CODE);

// Set by the consent page; gates the study timeline and the end-of-study handling.
let PARTICIPANT_CONSENTED = false;

const TEST_MODE_REQUESTED = URL_PARAMS.has("test") || URL_PARAMS.has("nscenarios");
const TEST_MODE_ALLOWED = !RUNNING_ON_PAVLOVIA || CONFIG.ALLOW_LIVE_TEST_MODE;
const IS_TEST_MODE = TEST_MODE_REQUESTED && TEST_MODE_ALLOWED;

function requestedScenarioCount() {
  if (!IS_TEST_MODE) return CONFIG.N_SCENARIOS;
  const raw = getUrlParam("nscenarios") || getUrlParam("test");
  const parsed = Number.parseInt(raw, 10);
  return Math.min(CONFIG.N_SCENARIOS, Math.max(1, Number.isFinite(parsed) ? parsed : 2));
}

const N_SCENARIOS_PRESENTED = requestedScenarioCount();

function localCompletionScreen() {
  const display = jsPsych.getDisplayElement();
  if (!display) return;
  display.innerHTML = `
    <div class="study-wrap">
      <div class="paper-card centered">
        <div class="eyebrow">Local test complete</div>
        <h2>Thank you</h2>
        <p>The test data have been downloaded to this browser.</p>
        <p class="small muted">This local run did not send data to Pavlovia or redirect to Prolific.</p>
      </div>
    </div>`;
}

function declineScreenHTML() {
  return `
    <div class="study-wrap">
      <div class="paper-card centered">
        <div class="eyebrow">Study ended</div>
        <h2>Thank you</h2>
        <p>You have chosen not to take part. No further questions will be shown.</p>
        <p class="small muted">${PROLIFIC_NOCONSENT_URL ? "You will now be returned to Prolific." : "You may now close this page."}</p>
      </div>
    </div>`;
}

function showDeclineScreen() {
  const display = jsPsych.getDisplayElement();
  if (display) display.innerHTML = declineScreenHTML();
}

const jsPsych = initJsPsych({
  show_progress_bar: false,
  on_finish: function() {
    if (!RUNNING_ON_PAVLOVIA && !PARTICIPANT_CONSENTED) {
      window.setTimeout(showDeclineScreen, 50);
      return;
    }
    if (!RUNNING_ON_PAVLOVIA && CONFIG.DOWNLOAD_LOCAL_DATA_ON_FINISH) {
      const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
      jsPsych.data.get().localSave("csv", `LOCAL_${CONFIG.STUDY_ID}_${makeRandomId(8)}_${timestamp}.csv`);
      window.setTimeout(localCompletionScreen, 50);
    }
  }
});

jsPsych.data.addProperties({
  study_id: CONFIG.STUDY_ID,
  experiment_version: CONFIG.EXPERIMENT_VERSION,
  schema_version: CONFIG.SCHEMA_VERSION,
  jspsych_version: typeof jsPsych.version === "function" ? jsPsych.version() : "unknown",
  session_id: SESSION_ID,
  prolific_pid: PROLIFIC_PID,
  prolific_study_id: PROLIFIC_STUDY_ID,
  prolific_session_id: PROLIFIC_SESSION_ID,
  pavlovia_participant: PAVLOVIA_PARTICIPANT,
  pavlovia_session: PAVLOVIA_SESSION,
  randomization_seed: RANDOMIZATION_SEED,
  running_on_pavlovia: RUNNING_ON_PAVLOVIA,
  test_mode: IS_TEST_MODE,
  planned_n_scenarios: CONFIG.N_SCENARIOS,
  presented_n_scenarios: N_SCENARIOS_PRESENTED,
  screen_width: window.screen ? window.screen.width : null,
  screen_height: window.screen ? window.screen.height : null,
  viewport_width: window.innerWidth,
  viewport_height: window.innerHeight
});

// Counts how often the participant leaves the page during one trial. Switching tabs
// fires both blur and visibilitychange, so an absence is counted once until return.
let blurState = null;

function startBlurCount() {
  const state = { count: 0, away: false };
  state.leave = function() {
    if (state.away) return;
    state.away = true;
    state.count += 1;
  };
  state.back = function() { state.away = false; };
  state.visibility = function() { document.hidden ? state.leave() : state.back(); };
  window.addEventListener("blur", state.leave);
  window.addEventListener("focus", state.back);
  document.addEventListener("visibilitychange", state.visibility);
  blurState = state;
}

function stopBlurCount() {
  const state = blurState;
  blurState = null;
  if (!state) return null;
  window.removeEventListener("blur", state.leave);
  window.removeEventListener("focus", state.back);
  document.removeEventListener("visibilitychange", state.visibility);
  return state.count;
}

// -----------------------------------------------------------------------------
// EXPERIMENTAL MATERIALS: 3 delegation conditions x 2 actor genders x 2 outcomes
// -----------------------------------------------------------------------------
// Vignettes follow the Kitayama et al. (2006) scenarios used by Genschow, Rigoni &
// Brass (2017): a senior person, a situation with stakes for other people, a
// deliberate decision about how to do the work, and its consequences.
// {Name} (full name, used once in each setup), {First} (first name, used after
// that), {he}, {him}, {his}, {himself}, {He} and {His} are filled per trial;
// success_phrase/failure_phrase restate the consequence in the items, and boss
// is the role participants take for the reward/punish items.
const TASKS = [
  {id:"dosing_guidance", label:"Dosing guidance", object:"dosing guidance", boss:"the hospital's chief executive",
    setup:"{Name} is the director of pharmacy at a large regional hospital. Because of a national shortage of a common antibiotic, the hospital must switch hundreds of patients to a substitute drug that is dosed differently.",
    action:"write new dosing guidance for the hospital's nurses",
    success:"The guidance is clear and accurate, and nurses switch patients to the substitute drug smoothly with no dosing errors.",
    failure:"The guidance contains several dosing errors, and a number of patients receive incorrect doses and need extra monitoring.",
    success_phrase:"nurses switching patients to the substitute drug without any dosing errors",
    failure_phrase:"patients receiving incorrect doses of the substitute drug"},
  {id:"relocation_plan", label:"School relocation plan", object:"relocation plan", boss:"the chair of the school board",
    setup:"{Name} is the superintendent of a school district. A week before the new school year, flooding damaged two elementary schools, and their 800 students have to be moved to other buildings.",
    action:"prepare the relocation plan that will be sent to families",
    success:"The plan lists the correct bus routes and times, and the first day of school runs smoothly for all 800 students.",
    failure:"The plan lists several incorrect bus routes and times, and hundreds of students miss the first day of school.",
    success_phrase:"the first day of school running smoothly for the relocated students",
    failure_phrase:"hundreds of students missing the first day of school"},
  {id:"heat_advisory", label:"Heat wave advisory", object:"advisory", boss:"the city manager",
    setup:"{Name} is the director of emergency management for a mid-sized city. Forecasters have warned that a severe heat wave will reach the city within three days.",
    action:"prepare a public advisory listing the city's cooling centres and their opening hours",
    success:"The advisory lists the correct addresses and opening hours, and many residents, including elderly people, use the cooling centres throughout the heat wave.",

const NAMES = {
  man: ["Daniel Harris", "Michael Turner", "Matthew Collins", "Andrew Mitchell", "Thomas Bennett", "James Carter"],
  woman: ["Laura Foster", "Rachel Hughes", "Emma Reynolds", "Sarah Morgan", "Hannah Brooks", "Jessica Parker"]
};

const CONDITIONS = [];
for (const delegation of ["solo", "human", "llm"]) {
  for (const actorGender of ["man", "woman"]) {
    for (const outcome of ["success", "failure"]) {
      CONDITIONS.push({ delegation, actor_gender: actorGender, outcome });
    }
  }
}

function buildTrials() {
  const conditionOrder = shuffle(CONDITIONS, RNG);
  const taskOrder = shuffle(TASKS, RNG);
  const names = { man: shuffle(NAMES.man, RNG), woman: shuffle(NAMES.woman, RNG) };
  const nameIndex = { man: 0, woman: 0 };

  return conditionOrder.map((condition, index) => {
    const actorGender = condition.actor_gender;
    const trial = {
      ...condition,
      task: taskOrder[index],
      name: names[actorGender][nameIndex[actorGender]],
      full_order_index: index + 1
    };
    nameIndex[actorGender] += 1;
    trial.condition_cell = `${trial.delegation}_${trial.actor_gender}_${trial.outcome}`;
    return trial;
  });
}

function validateFullDesign(trials) {
  const cells = new Set(trials.map(trial => trial.condition_cell));
  const tasks = new Set(trials.map(trial => trial.task.id));
  const maleNames = new Set(trials.filter(trial => trial.actor_gender === "man").map(trial => trial.name));
  const femaleNames = new Set(trials.filter(trial => trial.actor_gender === "woman").map(trial => trial.name));
  if (trials.length !== 12 || cells.size !== 12 || tasks.size !== 12 || maleNames.size !== 6 || femaleNames.size !== 6) {
    throw new Error("The generated experiment does not contain the intended balanced 3 x 2 x 2 design.");
  }
}

const FULL_TRIALS = buildTrials();
validateFullDesign(FULL_TRIALS);
const TRIALS = FULL_TRIALS.slice(0, N_SCENARIOS_PRESENTED);

function prototypeNote() {
  const missing = [];
  if (!CONFIG.LETTER_OF_INFORMATION_URL) missing.push("approved Letter of Information URL");
  if (!COMPLETION_CODE_CONFIGURED) missing.push("Prolific completion code");
  if (!NOCONSENT_CODE_CONFIGURED) missing.push("Prolific no-consent code");
  if (missing.length === 0 && !IS_TEST_MODE) return "";
  const details = [];
  const list = missing.length > 1 ? `${missing.slice(0, -1).join(", ")} and ${missing[missing.length - 1]}` : missing[0];
  if (missing.length) details.push(`Before launch, configure: ${list}.`);
  if (IS_TEST_MODE) details.push(`Local test mode is showing ${N_SCENARIOS_PRESENTED} of ${CONFIG.N_SCENARIOS} scenarios.`);
  return `<div class="prototype-note"><strong>Researcher preview:</strong> ${details.join(" ")}</div>`;
}

function progressHTML(index) {
  const percent = Math.min(100, (index / N_SCENARIOS_PRESENTED) * 100);
  return `

    </div>`;
}

function actorPronouns(gender) {
  return gender === "man"
    ? { he: "he", him: "him", his: "his", himself: "himself" }
    : { he: "she", him: "her", his: "her", himself: "herself" };
}

function fillTemplate(text, trial) {
  const pronouns = actorPronouns(trial.actor_gender);
  return text.replace(/\{(Name|First|he|him|his|himself|He|His)\}/g, function(match, key) {
    if (key === "Name") return trial.name;
    if (key === "First") return trial.name.split(" ")[0];
    const word = pronouns[key.toLowerCase()];
    return key[0] === key[0].toUpperCase() ? word[0].toUpperCase() + word.slice(1) : word;
  });
}

function makeVignetteHTML(trial) {
  const task = trial.task;
  const decision = `In response, {First} decides to ${task.action}.`;
  const workDescription = {
    solo: `${decision} {First} completes all parts of the work personally, reviews the draft, makes any edits {he} thinks are necessary, and prepares the final ${task.object} {himself}.`,
    human: `${decision} {First} completes most of the work but asks a colleague to complete approximately one-third of it. {First} reviews the colleague's work, makes any edits {he} thinks are necessary, and incorporates it into the final ${task.object}.`,
    llm: `${decision} {First} completes most of the work but asks a large language model, such as ChatGPT, to complete approximately one-third of it. {First} reviews the model's work, makes any edits {he} thinks are necessary, and incorporates it into the final ${task.object}.`
  }[trial.delegation];

  // Say where the errors were (or were not), so people don't guess differently for a colleague and an LLM.
  const helperPart = { human: "the part the colleague completed", llm: "the part the large language model completed" }[trial.delegation];
  const sourceText = trial.outcome === "success"
    ? (trial.delegation === "solo"
        ? "Every part {First} completed is free of errors."
        : `${helperPart[0].toUpperCase() + helperPart.slice(1)} is free of errors too, and {First} kept it after reviewing it.`)
    : (trial.delegation === "solo"
        ? "The errors are all in one part, about one-third of the work, and {First} did not catch them when reviewing it."
        : `The errors are all in ${helperPart}, and {First} did not catch them when reviewing it.`);
  const outcomeText = `${trial.outcome === "success" ? task.success : task.failure} ${fillTemplate(sourceText, trial)}`;
  return `
    <article class="scenario-card">
      <div class="eyebrow">Workplace scenario</div>
      <h2>${task.label}</h2>
      <div class="scenario-text">
        <p>${fillTemplate(task.setup, trial)}</p>
        <p>${fillTemplate(workDescription, trial)}</p>
      </div>
      <div class="outcome-panel">
        <span class="outcome-label">What happened</span>
        ${outcomeText}

    </article>`;
}

// 7-point agreement scale from Genschow et al. (2017).
const LIKERT_LABELS = [
  "Strongly disagree", "Disagree", "Somewhat disagree", "Neither agree nor disagree",
  "Somewhat agree", "Agree", "Strongly agree"
];

// Kitayama person/situation examples; the person examples are adapted for work quality.
const PERSON_EXAMPLES = "character, ability, or effort";
const SITUATION_EXAMPLES = "the atmosphere, social norms, or other contextual factors";

function likertHTML(name, prompt, prefix, labels = LIKERT_LABELS) {
  const questionId = `${prefix}-${name}-question`;
  const options = labels.map(function(label, i) {
    return `
        <label class="likert-option">
          <input type="radio" name="${name}" value="${i + 1}" required>
          <span class="likert-num">${i + 1}</span>
          <span class="likert-text">${label}</span>
        </label>`;
  }).join("");
  return `
    <fieldset class="likert-item" tabindex="-1" data-likert="${name}">
      <legend class="likert-question" id="${questionId}">${prompt}</legend>
      <div class="likert-scale">${options}</div>
    </fieldset>`;
}

// Manipulation check: who did the delegated third. Values match trial.delegation.
const MANIP_CHECK_OPTIONS = [
  ["solo", "No one. {First} did all of the work"],
  ["human", "A colleague"],
  ["llm", "A large language model (an AI tool such as ChatGPT)"]
];

function manipCheckHTML(trial, prefix) {
  const options = MANIP_CHECK_OPTIONS.map(([value, label]) => `
        <label class="choice-label"><input type="radio" name="manip_check" value="${value}" required>${fillTemplate(label, trial)}</label>`).join("");
  return `
    <fieldset class="likert-item" tabindex="-1" data-likert="manip_check">
      <legend class="likert-question" id="${prefix}-manip_check-question">In this scenario, who completed about one-third of the work?</legend>
      <div class="choice-list">${options}</div>
    </fieldset>`;
}

function makeRatingHTML(trial, index) {
  const task = trial.task;
  const prefix = `rating-${index}`;
  const item = (name, text) => likertHTML(name, fillTemplate(text, trial), prefix);
  const behaviour = trial.outcome === "success" ? task.success_phrase : task.failure_phrase;

  const primary = trial.outcome === "success"
    ? item("primary_credit", "{First} deserves credit for what happened.")
    : item("primary_blame", "{First} deserves blame for what went wrong.");

  const attribution = [
    item("person_cause", `{First}'s personal qualities, such as {his} ${PERSON_EXAMPLES}, influenced the outcome: ${behaviour}.`),
    item("situation_cause", `{First}'s surroundings, such as ${SITUATION_EXAMPLES}, influenced the outcome: ${behaviour}.`),
    item("person_cf", `If {First}'s personal qualities, such as {his} ${PERSON_EXAMPLES}, had been different, the outcome would have been different.`),
    item("situation_cf", `If {First}'s surroundings, such as ${SITUATION_EXAMPLES}, had been different, the outcome would have been different.`)
  ];
  if (trial.delegation !== "solo") {
    const helper = trial.delegation === "human" ? "the colleague" : "the large language model";
    attribution.push(item("helper_cause", `The part of the work ${helper} completed influenced the outcome: ${behaviour}.`));
  }

  const consequences = [
    item("reward", `As ${task.boss}, I would reward {First} and give {him} a bonus.`),
    item("punish", `As ${task.boss}, I would punish {First} and give {him} a formal reprimand.`)
  ].join("");

  return `
    <div class="rating-instructions">Please answer every question before continuing. Indicate how much you agree or disagree with each statement.</div>
    <div class="rating-section-label">Your main judgment</div>
    ${primary}
    <div class="rating-section-label">What influenced the outcome</div>
    ${attribution.join("")}
    <div class="rating-section-label">If you were ${task.boss}</div>
    ${consequences}
    <div class="rating-section-label">Your confidence</div>
    ${item("certainty", "Regarding the statements above, I am sure that my judgments are correct.")}
    <div class="rating-section-label">About the scenario</div>
    ${manipCheckHTML(trial, prefix)}
    <div id="item-completion" class="completion-status" aria-live="polite"></div>`;
}

function bindRequiredItems() {
  const form = document.getElementById("jspsych-survey-html-form");
  const groups = Array.from(document.querySelectorAll("[data-likert]"));
  const status = document.getElementById("item-completion");
  if (!form || groups.length === 0) return;

  // This check replaces the browser's required-field bubbles, so they cannot double-prompt.
  form.noValidate = true;
  let announcedComplete = false;
  const unanswered = () => groups.filter(group => group.querySelector("input:checked") === null);

  function announce(text) {
    if (!status) return;
    // Clearing first makes screen readers repeat an unchanged message on a second attempt.
    status.textContent = "";
    window.setTimeout(function() { status.textContent = text; }, 50);
  }

  for (const group of groups) {
    group.addEventListener("change", function() {
      group.classList.add("answered");
      group.classList.remove("missing");
      if (!announcedComplete && unanswered().length === 0) {
        announcedComplete = true;
        announce("All questions answered. You can continue.");
      }
    });
  }

  // Capture phase runs before the plugin's own submit listener on the form.
  form.addEventListener("submit", function(event) {
    const missing = unanswered();
    if (missing.length === 0) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    for (const group of missing) group.classList.add("missing");
    announce(`${missing.length} question${missing.length === 1 ? "" : "s"} remaining.`);
    missing[0].focus();
  }, true);
}

function mean(values) {
  if (values.length === 0 || values.some(value => value === null)) return null;
  return values.reduce((sum, value) => sum + value, 0) / values.length;
}

function numericResponse(response, field) {
  return Object.prototype.hasOwnProperty.call(response, field) ? Number(response[field]) : null;
}

const RATING_FIELDS = [
  "primary_credit", "primary_blame", "person_cause", "situation_cause",
  "person_cf", "situation_cf", "helper_cause", "reward", "punish", "certainty"
];

function normalizeRatingData(data) {
  const response = data.response || {};
  for (const field of RATING_FIELDS) data[field] = numericResponse(response, field);
  // Scored as in Genschow et al. (2017): internal minus external attribution.
  data.internal_attribution = mean([data.person_cause, data.person_cf]);
  data.external_attribution = mean([data.situation_cause, data.situation_cf]);
  data.correspondence_bias = data.internal_attribution === null || data.external_attribution === null
    ? null
    : data.internal_attribution - data.external_attribution;
  data.rating_items_answered = RATING_FIELDS.filter(field => data[field] !== null).length;
  data.manip_check = response.manip_check || null;
  data.manip_check_correct = data.manip_check === null ? null : data.manip_check === data.delegation;
}

function trialMetadata(trial, index, role) {
  return {
    trial_role: role,
    scenario_index: index + 1,
    full_order_index: trial.full_order_index,
    task_id: trial.task.id,
    task_label: trial.task.label,
    condition_cell: trial.condition_cell,
    delegation: trial.delegation,
    actor_gender: trial.actor_gender,
    actor_name: trial.name,
    outcome: trial.outcome,
    delegate_type: trial.delegation === "human" ? "colleague" : trial.delegation === "llm" ? "llm" : "none"
  };
}

const FWI_SUBSCALES = {
  free_will: [1, 4, 7, 10, 13],
  determinism: [2, 5, 8, 11, 14],
  dualism: [3, 6, 9, 12, 15]
};

// Instructed-response item shown unnumbered after FWI item 8; 3 = "Somewhat disagree".
const ATTENTION_CHECK_AFTER_ITEM = 8;
const ATTENTION_CHECK_TARGET = 3;

function fwiHTML() {
  const items = FWI_ITEMS.map(function(text, i) {
    const html = likertHTML(`fwi_${i + 1}`, `${i + 1}. ${text}`, "fwi");
    return i + 1 === ATTENTION_CHECK_AFTER_ITEM
      ? html + likertHTML("attention_check", "To show you are reading carefully, please select Somewhat disagree.", "fwi")
      : html;
  }).join("");
  return `
    <div class="study-wrap">
      <div class="paper-card compact ratings-header">
        <div class="eyebrow">Your views</div>
        <h2>Beliefs about people and their choices</h2>
        <p class="muted">Please indicate how much you agree or disagree with each statement. There are no right or wrong answers.</p>
      </div>
      ${items}
      <div id="item-completion" class="completion-status" aria-live="polite"></div>
    </div>`;
}

const fwiPage = {
  type: jsPsychSurveyHtmlForm,
  html: fwiHTML,
  button_label: "Continue",
  on_load: function() {
    bindRequiredItems();
    startBlurCount();
  },
  data: { trial_role: "free_will_inventory" },
  on_finish: function(data) {
    data.blur_count = stopBlurCount();
    const response = data.response || {};
    const score = n => data[`fwi_${n}`];
    FWI_ITEMS.forEach((_, i) => { data[`fwi_${i + 1}`] = numericResponse(response, `fwi_${i + 1}`); });
    data.attention_check = numericResponse(response, "attention_check");
    data.attention_check_passed = data.attention_check === ATTENTION_CHECK_TARGET;
    for (const [subscale, items] of Object.entries(FWI_SUBSCALES)) data[`fwi_${subscale}`] = mean(items.map(score));
    // Compound score as in Genschow et al. (2017): free will + dualism + reversed determinism.
    const compound = [...FWI_SUBSCALES.free_will, ...FWI_SUBSCALES.dualism].map(score)
      .concat(FWI_SUBSCALES.determinism.map(n => score(n) === null ? null : 8 - score(n)));
    data.fwi_compound = mean(compound);
  }
};

// Copied from the Forecasting Game study (items 9, 10, 12, 14, 16, 17), with its
// endpoint-and-midpoint labels. Stored as 1-7 (the Forecasting Game's
// survey-likert stored 0-6).

    output: "Sustainable power reduces emissions and secures resources for future generations.",
    mentalistic: "The AI believes environmental protection is essential.",
    mechanistic: "The AI selects statistically linked terms on sustainability." },
  { id: 14, prompt: "Give advice to someone nervous before a public speech.",
    output: "Take slow breaths, focus on your message, not the audience's faces.",

const EST_LABELS = ["Strongly disagree", "", "", "Neutral", "", "", "Strongly agree"];

function estExchangeHTML(prompt, output) {
  return `
    <div class="outcome-panel">
      <span class="outcome-label">User prompt</span>
      <p class="est-text">"${prompt}"</p>
      <span class="outcome-label">AI output</span>
      <p class="est-text">"${output}"</p>
    </div>`;
}

// The worked example's Explanation A is mentalistic or mechanistic at random.
const EST_EXAMPLE_MENTAL_FIRST = RNG() < 0.5;
const EST_EXAMPLE = EST_EXAMPLE_MENTAL_FIRST
  ? ["The AI wanted to make the user feel welcomed.", "The AI assembled common greeting phrases from prior text."]
  : ["The AI assembled common greeting phrases from prior text.", "The AI wanted to make the user feel welcomed."];

const estInstructionsPage = {
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <div class="study-wrap">
      <div class="paper-card">
        <div class="eyebrow">Explanations of AI responses</div>
        <h2>How AI produces its answers</h2>
        <p>You will see short scenarios in which a person types a prompt to a generative AI system (e.g., ChatGPT, Gemini, DeepSeek), and the AI produces an output.</p>
        <p>For each scenario, you will rate how much you agree with <strong>two different explanations</strong> of why the AI produced that response.</p>
        <p>There are no right or wrong answers. Please respond based on what you genuinely think.</p>
        <div class="eyebrow" style="margin-top:26px;">Example</div>
        ${estExchangeHTML("Write a friendly greeting.", "Hi there! Hope you're having a great day.")}
        <p style="margin-top:18px;"><strong>Explanation A:</strong> "${EST_EXAMPLE[0]}"</p>
        <p><strong>Explanation B:</strong> "${EST_EXAMPLE[1]}"</p>
        <p class="small muted">In the real task, you will rate your agreement with both explanations on a 1 to 7 scale.</p>
      </div>
    </div>`,
  choices: ["Continue"],
  data: { trial_role: "est_instructions", est_example_order: EST_EXAMPLE_MENTAL_FIRST ? "mentalistic_first" : "mechanistic_first" }
};

function makeESTPage(item, mentalFirst, index) {
  const code = String(item.id).padStart(2, "0");
  const prefix = `est-${code}`;
  const mental = likertHTML("mentalistic", item.mentalistic, prefix, EST_LABELS);
  const mech = likertHTML("mechanistic", item.mechanistic, prefix, EST_LABELS);
  return {
    type: jsPsychSurveyHtmlForm,
    html: `
      <div class="study-wrap">
        <div class="paper-card compact ratings-header">
          <div class="eyebrow">Explanations of AI responses · ${index + 1} of ${EST_ITEMS.length}</div>
          ${estExchangeHTML(item.prompt, item.output)}
        </div>
        <div class="rating-instructions">How much do you agree with each explanation of why the AI produced this response?</div>
        ${mentalFirst ? mental + mech : mech + mental}
        <div id="item-completion" class="completion-status" aria-live="polite"></div>
      </div>`,
    button_label: "Continue",
    on_load: function() {
      bindRequiredItems();
      startBlurCount();
      window.scrollTo(0, 0);
    },
    data: {
      trial_role: "est_item",
      est_item_id: item.id,
      est_order: mentalFirst ? "mentalistic_first" : "mechanistic_first"
    },
    on_finish: function(data) {
      data.blur_count = stopBlurCount();
      const response = data.response || {};
      data.est_mentalistic = numericResponse(response, "mentalistic");
      data.est_mechanistic = numericResponse(response, "mechanistic");
    }
  };
}

// Half the items show the mentalistic explanation first, assigned at random per
// participant (seeded RNG); item order is fixed, as in the original.
function buildESTPages() {
  const half = Math.floor(EST_ITEMS.length / 2);
  const mentalFirst = shuffle(EST_ITEMS.map((_, i) => i < half), RNG);
  return [estInstructionsPage, ...EST_ITEMS.map((item, i) => makeESTPage(item, mentalFirst[i], i))];
}

function makePavloviaFinish() {

    type: jsPsychPavlovia,
    command: "finish",
    data: { trial_role: "pavlovia_finish" },
    on_load: function() {
      const display = jsPsych.getDisplayElement();
      if (!display) return;
      if (!PARTICIPANT_CONSENTED) {
        display.innerHTML = declineScreenHTML();
        return;
      }
      display.innerHTML = `
        <div class="study-wrap">
          <div class="paper-card centered" aria-live="polite">

          </div>

      if (PROLIFIC_RETURN_URL) {

            </div>
          </div>`;
      }
    }
  };
}

// -----------------------------------------------------------------------------
// TIMELINE ASSEMBLY
// -----------------------------------------------------------------------------
function buildTimeline() {
  const timeline = [];
  if (RUNNING_ON_PAVLOVIA) timeline.push(makePavloviaInit());
  timeline.push(consentPage);

  // Everything after consent runs only for people who consented; the Pavlovia
  // finish trial below still runs for decliners so their session closes cleanly.
  const study = [welcomePage, instructionsPage];
  TRIALS.forEach(function(trial, index) {
    study.push({
      type: jsPsychSurveyHtmlForm,
      html: function() { return makeScenarioPageHTML(trial, index); },
      button_label: "Continue",
      on_load: function() {
        // Keep the Continue button under the questions rather than below both columns.
        const column = document.querySelector(".split-questions");
        const button = document.querySelector(".jspsych-btn");
        if (column && button) column.appendChild(button);
        bindRequiredItems();
        startBlurCount();
        window.scrollTo(0, 0);
      },
      data: trialMetadata(trial, index, "ratings"),
      on_finish: function(data) {
        data.blur_count = stopBlurCount();
        normalizeRatingData(data);
      }
    });
  });
  study.push(fwiPage, ...buildESTPages(), demographicsPage, funnelPage, debriefPage, finalPage);

  timeline.push({ timeline: study, conditional_function: () => PARTICIPANT_CONSENTED });
  if (RUNNING_ON_PAVLOVIA) timeline.push(makePavloviaFinish());
  return timeline;
}

// Desktop only (also set the Prolific device filter). iPadOS reports a Mac user agent,
// so a touch-capable "Macintosh" counts as a tablet. Test mode skips the check.
function isPhoneOrTablet() {
  if (navigator.userAgentData && navigator.userAgentData.mobile) return true;
  const ua = navigator.userAgent || "";
  return /Mobi|Android|iPhone|iPad|iPod|Tablet|Silk|Kindle/i.test(ua) ||
    (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
}

function showDesktopOnlyScreen() {
  const display = jsPsych.getDisplayElement() || document.body;
  display.innerHTML = `
    <div class="study-wrap">
      <div class="paper-card centered">
        <div class="eyebrow">Computer required</div>
        <h2>Please use a desktop or laptop computer</h2>
        <p>This study can only be completed on a desktop or laptop computer. It cannot be completed on a phone or tablet.</p>
        <p class="small muted">If you came from Prolific, please return the study there, or reopen this link on a computer.</p>
      </div>
    </div>`;
}

function startExperiment() {
  if (!IS_TEST_MODE && isPhoneOrTablet()) {
    showDesktopOnlyScreen();
    return;
  }
  if (ensurePavloviaParameters()) return;
  jsPsych.run(buildTimeline());
}

window.addEventListener("load", startExperiment);
</script>
