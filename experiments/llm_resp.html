<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workplace Evaluation Study</title>

  <script src="https://unpkg.com/jspsych@8.3.0"></script>
  <link href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" rel="stylesheet">

  <!-- Official Pavlovia bridge used by the reference study and Pavlovia's jsPsych guide. -->
  <script src="https://pavlovia.org/lib/jspsych-7-pavlovia-2022.1.1.js"></script>

  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@2.1.0"></script>

  <style>
    :root {
      --accent: #7a003c;
      --accent-dark: #5a002c;
      --accent-soft: #f5eaf0;
      --ink: #24211f;
      --muted: #706b66;
      --line: #ded9d1;
      --paper: #fffefb;
      --canvas: #f7f5ef;
      --soft: #f1eee7;
      --shadow: 0 14px 38px rgba(54, 42, 34, 0.08);
    }

    * { box-sizing: border-box; }
    html { background: var(--canvas); }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(122, 0, 60, 0.045), transparent 30rem),
        var(--canvas);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    .jspsych-display-element {
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      line-height: 1.6;
    }

    #jspsych-content {
      width: min(100% - 32px, 1200px);
      max-width: 1200px;
      margin: 0 auto;
      padding: 34px 0 54px;
    }

    .study-wrap { width: 100%; max-width: 800px; margin: 0 auto; text-align: left; }
    .study-wrap.split { max-width: none; }

    .split-layout {
      display: grid;
      grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
      gap: 28px;
      align-items: start;
    }

    .split-scenario {
      position: sticky;
      top: 20px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
    }

    .split-scenario .scenario-card { padding: 28px 30px; }
    .split-scenario .scenario-text { font-size: 17px; line-height: 1.7; }
    .split-questions .rating-instructions { margin-top: 0; }
    .split-questions .jspsych-btn { display: block; margin: 24px auto 0 !important; }

    @media (max-width: 960px) {
      .split-layout { grid-template-columns: 1fr; gap: 18px; }
      .split-scenario { position: static; max-height: none; overflow: visible; }
    }

    .paper-card {
      width: 100%;
      padding: 38px 44px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .paper-card.compact { padding-top: 32px; padding-bottom: 32px; }
    .paper-card.centered { text-align: center; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1, h2, h3 { color: var(--ink); font-weight: 400; }
    h1 { margin: 0 0 16px; font-size: clamp(30px, 5vw, 42px); line-height: 1.12; }
    h2 { margin: 0 0 18px; font-size: 26px; line-height: 1.25; }
    h3 { margin: 0 0 10px; font-size: 19px; }
    p { margin: 12px 0; }

    .lead { font-size: 19px; line-height: 1.65; }
    .muted { color: var(--muted); }
    .small { font-size: 14px; }

    .prototype-note,
    .setup-warning {
      margin: 0 0 18px;
      padding: 12px 15px;
      border: 1px solid #e6c9d7;
      border-left: 4px solid var(--accent);
      border-radius: 4px;
      background: #fff8fb;
      color: #5f1839;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      line-height: 1.45;
    }

    .study-facts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 26px 0;
    }

    .study-fact {
      min-height: 100px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }

    .study-fact strong {
      display: block;
      margin-bottom: 5px;
      color: var(--accent);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .instruction-list { margin: 20px 0 0; padding-left: 22px; }
    .instruction-list li { margin: 10px 0; padding-left: 5px; }

    .consent-copy {
      max-height: 300px;
      overflow-y: auto;
      margin: 20px 0;
      padding: 20px 22px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #fbfaf7;
      font-size: 15px;
    }

    .consent-copy p:first-child { margin-top: 0; }
    .consent-copy p:last-child { margin-bottom: 0; }

    .consent-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 18px 0 0;
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #fff;
      font-size: 15px;
      line-height: 1.45;
    }

    .consent-label input { flex: 0 0 auto; margin-top: 4px; accent-color: var(--accent); }

    .progress-wrap { width: 100%; margin: 0 0 18px; }
    .progress-track { width: 100%; height: 7px; overflow: hidden; border-radius: 999px; background: #e7e2da; }
    .progress-fill { height: 100%; border-radius: inherit; background: var(--accent); transition: width 180ms ease; }
    .progress-label { margin-top: 6px; color: var(--muted); font-family: Arial, Helvetica, sans-serif; font-size: 12px; text-align: right; }

    .scenario-card {
      padding: 34px 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .scenario-card h2 { margin-bottom: 24px; color: var(--accent); }
    .scenario-text { font-size: 18px; line-height: 1.75; }

    .outcome-panel {
      margin-top: 24px;
      padding: 17px 20px;
      border-left: 4px solid var(--accent);
      border-radius: 0 5px 5px 0;
      background: var(--soft);
      line-height: 1.6;
    }

    .outcome-label {
      display: block;
      margin-bottom: 5px;
      color: var(--accent);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .ratings-header { margin-bottom: 18px; }

    .rating-instructions {
      margin: 14px 0 20px;
      padding: 12px 15px;
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
      color: #4f1832;
      font-size: 14px;
    }

    .rating-section-label {
      margin: 28px 0 10px;
      color: var(--accent);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .likert-item {
      margin: 12px 0;
      padding: 18px 20px 16px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }

    .likert-question {
      margin: 0 0 14px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
    }

    .likert-scale {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }

    .likert-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 8px 4px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #faf9f6;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      line-height: 1.25;
      text-align: center;
      cursor: pointer;
    }

    .likert-option input { margin: 0; accent-color: var(--accent); }
    .likert-num { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .likert-option:hover { border-color: #c6a0b3; }
    .likert-option:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-dark); font-weight: 700; }
    .likert-option:has(input:focus-visible) { outline: 3px solid rgba(23, 105, 170, 0.35); outline-offset: 2px; }

    .likert-item.answered { border-color: #c6a0b3; background: #fffcfd; }

    .completion-status {
      min-height: 22px;
      margin: 15px 0 0;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      text-align: center;
    }

    .form-fieldset { margin: 18px 0; padding: 20px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
    .form-fieldset legend { padding: 0 7px; font-weight: 700; }

    .number-field {
      width: 150px;
      margin-top: 8px;
      padding: 10px 12px;
      border: 1px solid #8a847d;
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }

    .choice-label { display: block; margin: 10px 0; line-height: 1.45; }
    .choice-label input { margin-right: 9px; accent-color: var(--accent); }

    .submit-spinner {
      width: 34px;
      height: 34px;
      margin: 24px auto;
      border: 4px solid #e4ddd6;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .jspsych-btn {
      min-width: 150px;
      margin: 24px 8px 0 !important;
      padding: 12px 24px !important;
      border: 1px solid var(--accent) !important;
      border-radius: 4px !important;
      background: var(--accent) !important;
      color: #fff !important;
      font-family: Georgia, "Times New Roman", serif !important;
      font-size: 16px !important;
      font-weight: 700 !important;
      letter-spacing: 0.01em;
      box-shadow: none !important;
      cursor: pointer;
      transition: background 120ms ease, transform 120ms ease;
    }

    .jspsych-btn:hover:not(:disabled) { background: var(--accent-dark) !important; transform: translateY(-1px); }
    .jspsych-btn:focus-visible { outline: 3px solid rgba(23, 105, 170, 0.45) !important; outline-offset: 3px; }
    .jspsych-btn:disabled { border-color: #aaa49d !important; background: #aaa49d !important; cursor: not-allowed; opacity: 0.72; }

    a { color: var(--accent); }
    a:focus-visible { outline: 3px solid rgba(23, 105, 170, 0.4); outline-offset: 3px; }

    @media (max-width: 700px) {
      #jspsych-content { width: min(100% - 22px, 800px); padding-top: 18px; }
      .paper-card, .scenario-card { padding: 26px 22px; }
      .study-facts { grid-template-columns: 1fr; }
      .study-fact { min-height: 0; }
      .likert-item { padding-left: 15px; padding-right: 15px; }
      .likert-scale { grid-template-columns: 1fr; gap: 5px; }
      .likert-option { flex-direction: row; gap: 10px; padding: 9px 12px; font-size: 14px; text-align: left; }
      .likert-num { min-width: 1em; }
    }

    @media (max-width: 440px) {
      .jspsych-btn { width: calc(100% - 16px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>

          async src="//gc.zgo.at/count.js"></script>
</head>

<script>
"use strict";

// -----------------------------------------------------------------------------
// STUDY AND PLATFORM CONFIGURATION
// Replace the blank study-specific values only after they have been approved.
// -----------------------------------------------------------------------------
const CONFIG = Object.freeze({
  STUDY_ID: "less_credit_same_blame",
  EXPERIMENT_VERSION: "4.0.0",
  SCHEMA_VERSION: "3.0.0",
  N_SCENARIOS: 12,
  LETTER_OF_INFORMATION_URL: "",
  PROLIFIC_COMPLETION_CODE: "",
  DOWNLOAD_LOCAL_DATA_ON_FINISH: true,
  ALLOW_LIVE_TEST_MODE: false
});

const RUNNING_ON_PAVLOVIA =
  window.location.hostname.includes("pavlovia.org") ||
  window.location.hostname.includes("run.pavlovia.org");

const URL_PARAMS = new URLSearchParams(window.location.search);

function getUrlParam(name) {
  return URL_PARAMS.get(name) || "";
}

function makeRandomId(length = 12) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let value = "";
  for (let i = 0; i < length; i++) value += chars[Math.floor(Math.random() * chars.length)];
  return value;
}

function createRandomSeed() {
  const supplied = getUrlParam("seed");
  if (/^\d+$/.test(supplied)) return Number(supplied) >>> 0;
  if (window.crypto && window.crypto.getRandomValues) {
    const values = new Uint32Array(1);
    window.crypto.getRandomValues(values);
    return values[0];
  }
  return (Date.now() ^ Math.floor(Math.random() * 0xffffffff)) >>> 0;
}

function mulberry32(seed) {
  return function() {
    let t = seed += 0x6d2b79f5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(array, rng) {
  const copy = [...array];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function ensurePavloviaParameters() {
  if (!RUNNING_ON_PAVLOVIA) return false;
  const url = new URL(window.location.href);
  let changed = false;

  if (!url.searchParams.has("participant")) {
    url.searchParams.set("participant", getUrlParam("PROLIFIC_PID") || makeRandomId(16));
    changed = true;
  }
  if (!url.searchParams.has("session")) {
    url.searchParams.set("session", getUrlParam("SESSION_ID") || makeRandomId(16));
    changed = true;
  }
  if (changed) {
    window.location.replace(url.toString());
    return true;
  }
  return false;
}

const PROLIFIC_PID = getUrlParam("PROLIFIC_PID");
const PROLIFIC_STUDY_ID = getUrlParam("STUDY_ID");
const PROLIFIC_SESSION_ID = getUrlParam("SESSION_ID");
const PAVLOVIA_PARTICIPANT = getUrlParam("participant");
const PAVLOVIA_SESSION = getUrlParam("session");
const SESSION_ID = PROLIFIC_SESSION_ID || PAVLOVIA_SESSION || makeRandomId(18);
const RANDOMIZATION_SEED = createRandomSeed();
const RNG = mulberry32(RANDOMIZATION_SEED);

const COMPLETION_CODE_CONFIGURED =
  /^[A-Za-z0-9]+$/.test(CONFIG.PROLIFIC_COMPLETION_CODE) &&
  !CONFIG.PROLIFIC_COMPLETION_CODE.toUpperCase().includes("REPLACE");

const PROLIFIC_RETURN_URL = COMPLETION_CODE_CONFIGURED
  ? `https://app.prolific.com/submissions/complete?cc=${encodeURIComponent(CONFIG.PROLIFIC_COMPLETION_CODE)}`
  : "";

const TEST_MODE_REQUESTED = URL_PARAMS.has("test") || URL_PARAMS.has("nscenarios");
const TEST_MODE_ALLOWED = !RUNNING_ON_PAVLOVIA || CONFIG.ALLOW_LIVE_TEST_MODE;
const IS_TEST_MODE = TEST_MODE_REQUESTED && TEST_MODE_ALLOWED;

function requestedScenarioCount() {
  if (!IS_TEST_MODE) return CONFIG.N_SCENARIOS;
  const raw = getUrlParam("nscenarios") || getUrlParam("test");
  const parsed = Number.parseInt(raw, 10);
  return Math.min(CONFIG.N_SCENARIOS, Math.max(1, Number.isFinite(parsed) ? parsed : 2));
}

const N_SCENARIOS_PRESENTED = requestedScenarioCount();

function localCompletionScreen() {
  const display = jsPsych.getDisplayElement();
  if (!display) return;
  display.innerHTML = `
    <div class="study-wrap">
      <div class="paper-card centered">
        <div class="eyebrow">Local test complete</div>
        <h2>Thank you</h2>
        <p>The test data have been downloaded to this browser.</p>
        <p class="small muted">This local run did not send data to Pavlovia or redirect to Prolific.</p>
      </div>
    </div>`;
}

const jsPsych = initJsPsych({
  show_progress_bar: false,
  on_finish: function() {
    if (!RUNNING_ON_PAVLOVIA && CONFIG.DOWNLOAD_LOCAL_DATA_ON_FINISH) {
      const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
      jsPsych.data.get().localSave("csv", `LOCAL_${CONFIG.STUDY_ID}_${makeRandomId(8)}_${timestamp}.csv`);
      window.setTimeout(localCompletionScreen, 50);
    }
  }
});

jsPsych.data.addProperties({
  study_id: CONFIG.STUDY_ID,
  experiment_version: CONFIG.EXPERIMENT_VERSION,
  schema_version: CONFIG.SCHEMA_VERSION,
  jspsych_version: typeof jsPsych.version === "function" ? jsPsych.version() : "unknown",
  session_id: SESSION_ID,
  prolific_pid: PROLIFIC_PID,
  prolific_study_id: PROLIFIC_STUDY_ID,
  prolific_session_id: PROLIFIC_SESSION_ID,
  pavlovia_participant: PAVLOVIA_PARTICIPANT,
  pavlovia_session: PAVLOVIA_SESSION,
  randomization_seed: RANDOMIZATION_SEED,
  running_on_pavlovia: RUNNING_ON_PAVLOVIA,
  test_mode: IS_TEST_MODE,
  planned_n_scenarios: CONFIG.N_SCENARIOS,
  presented_n_scenarios: N_SCENARIOS_PRESENTED
});

// -----------------------------------------------------------------------------
// EXPERIMENTAL MATERIALS: 3 delegation conditions x 2 actor genders x 2 outcomes
// -----------------------------------------------------------------------------
// Vignettes follow the Kitayama et al. (2006) scenarios used by Genschow, Rigoni &
// Brass (2017): a senior person, a situation with stakes for other people, a
// deliberate decision about how to do the work, and its consequences.
// {Name}, {he}, {him}, {his}, {himself}, {He} and {His} are filled per trial;
// success_phrase/failure_phrase restate the consequence in the items, and boss
// is the role participants take for the reward/punish items.
const TASKS = [
  {id:"dosing_guidance", label:"Dosing guidance", object:"dosing guidance", boss:"the hospital's chief executive",
    setup:"{Name} is the director of pharmacy at a large regional hospital. Because of a national shortage of a common antibiotic, the hospital must switch hundreds of patients to a substitute drug that is dosed differently.",
    action:"write new dosing guidance for the hospital's nurses",
    success:"Nurses switch patients to the substitute drug smoothly, and no dosing errors occur.",
    failure:"The guidance contains several dosing errors, and a number of patients receive incorrect doses and need extra monitoring.",
    success_phrase:"nurses switching patients to the substitute drug without any dosing errors",
    failure_phrase:"patients receiving incorrect doses of the substitute drug"},
  {id:"relocation_plan", label:"School relocation plan", object:"relocation plan", boss:"the chair of the school board",
    setup:"{Name} is the superintendent of a school district. A week before the new school year, flooding damaged two elementary schools, and their 800 students have to be moved to other buildings.",
    action:"prepare the relocation plan that will be sent to families",
    success:"Families know where and when to bring their children, and the first day of school runs smoothly.",
    failure:"The plan lists several incorrect bus routes and times, and hundreds of students miss the first day of school.",
    success_phrase:"the first day of school running smoothly for the relocated students",
    failure_phrase:"hundreds of students missing the first day of school"},
  {id:"heat_advisory", label:"Heat wave advisory", object:"advisory", boss:"the city manager",
    setup:"{Name} is the director of emergency management for a mid-sized city. Forecasters have warned that a severe heat wave will reach the city within three days.",
    action:"prepare a public advisory listing the city's cooling centres and their opening hours",
    success:"Residents find the cooling centres easily, and the centres are well used throughout the heat wave.",
    failure:"The advisory lists several wrong addresses and opening hours, and many residents, including elderly people, arrive at buildings that are closed.",
    success_phrase:"residents finding and using the cooling centres during the heat wave",
    failure_phrase:"many residents arriving at cooling centres that were closed"},
  {id:"regulator_report", label:"Report to the regulator", object:"report", boss:"the bank's chief executive",
    setup:"{Name} is the chief compliance officer at a national bank. A new regulation requires the bank to report to the government regulator how it protects its customers' savings.",
    action:"prepare the bank's report to the regulator",
    success:"The regulator accepts the report without any concerns, and the bank avoids a costly review.",
    failure:"The report contains several important errors, and the regulator fines the bank $2 million.",
    success_phrase:"the regulator accepting the report without any concerns",
    failure_phrase:"the regulator fining the bank $2 million"},
  {id:"rebooking_instructions", label:"Storm rebooking instructions", object:"instructions", boss:"the airline's chief executive",
    setup:"{Name} is a vice-president of operations at a large airline. A winter storm is expected to cancel more than 300 of the airline's flights over the coming weekend.",
    action:"prepare instructions telling the airline's agents how to rebook affected passengers",
    success:"Agents rebook passengers quickly, and almost everyone reaches their destination within a day.",
    failure:"The instructions contain several important errors, and thousands of passengers are stranded at airports overnight.",
    success_phrase:"almost all passengers reaching their destination within a day",
    failure_phrase:"thousands of passengers being stranded at airports overnight"},
  {id:"recall_notice", label:"Product recall notice", object:"recall notice", boss:"the company's chief executive",
    setup:"{Name} is the head of quality assurance at a packaged-food company. Laboratory tests have found that some batches of the company's peanut-free granola bars may contain traces of peanuts.",
    action:"prepare the recall notice for stores and customers",
    success:"Stores remove the affected batches within a day, and no customers have an allergic reaction.",
    failure:"The notice lists several wrong batch numbers, the affected bars stay on shelves for another week, and several customers have allergic reactions.",
    success_phrase:"the affected bars being removed before any customer had an allergic reaction",
    failure_phrase:"several customers having allergic reactions"},
  {id:"assistance_guide", label:"Winter assistance guide", object:"guide", boss:"the company's chief executive",
    setup:"{Name} is a senior manager at an electric company that serves several large cities. After electricity prices rose sharply, the company created a program to cut winter bills for low-income households.",
    action:"prepare the guide explaining who is eligible and how to apply",
    success:"Most eligible households apply, and thousands of families have their winter bills reduced.",
    failure:"The guide describes the eligibility rules incorrectly, and thousands of eligible families do not apply and pay full price all winter.",
    success_phrase:"thousands of families having their winter bills reduced",
    failure_phrase:"thousands of eligible families missing out on reduced winter bills"},
  {id:"grant_proposal", label:"Grant proposal", object:"proposal", boss:"the chair of the food bank's board",
    setup:"{Name} is the executive director of a food bank. A national foundation has invited the food bank to apply for a large grant that would let it serve 2,000 more families each month.",
    action:"write the grant proposal",
    success:"The foundation awards the grant, and the food bank begins serving 2,000 more families each month.",
    failure:"The proposal contains several important errors, the foundation rejects it, and the planned expansion is cancelled.",
    success_phrase:"the food bank receiving the grant and serving 2,000 more families",
    failure_phrase:"the foundation rejecting the proposal and the expansion being cancelled"},
  {id:"safety_manual", label:"Crane safety manual", object:"safety manual", boss:"the company's chief executive",
    setup:"{Name} is the director of safety at a construction company. The company has just bought a new type of crane for its building sites, and none of its workers have operated one before.",
    action:"write the safety manual that crane operators and site workers must follow",
    success:"Workers follow the manual, and the cranes are used for a full year without a single accident.",
    failure:"The manual contains several important errors, and two workers are injured in accidents during the first month.",
    success_phrase:"the cranes being used for a year without a single accident",
    failure_phrase:"two workers being injured in crane accidents"},
  {id:"breach_notice", label:"Data breach notification", object:"notification", boss:"the company's chief executive",
    setup:"{Name} is the chief technology officer at an online retailer. Hackers have stolen the passwords of about 50,000 of the company's customers.",
    action:"write the notification telling affected customers what happened and how to protect their accounts",
    success:"Almost all affected customers secure their accounts within a few days, and very few lose any money.",
    failure:"The notification gives several incorrect instructions, and hundreds of customers have money taken from their accounts.",
    success_phrase:"almost all affected customers securing their accounts in time",
    failure_phrase:"hundreds of customers having money taken from their accounts"},
  {id:"scholarship_guidelines", label:"Scholarship guidelines", object:"guidelines", boss:"the university's president",
    setup:"{Name} is a dean at a public university. A donor has just given the university $5 million to fund scholarships for students from low-income families.",
    action:"write the guidelines the selection committee will use to decide who receives a scholarship",
    success:"The committee awards every scholarship to a qualified student, and the donor praises the program.",
    failure:"The guidelines contain several important errors, and dozens of qualified students are wrongly turned down.",
    success_phrase:"every scholarship going to a qualified student",
    failure_phrase:"dozens of qualified students being wrongly turned down"},
  {id:"service_notice", label:"Subway closure notice", object:"notice", boss:"the transit agency's chief executive",
    setup:"{Name} is the director of customer service at a city transit agency. The city's busiest subway line will close for two weeks of urgent repairs.",
    action:"prepare the notice telling riders about the replacement bus service",
    success:"Riders switch to the replacement buses smoothly, and delays stay short throughout the closure.",
    failure:"The notice gives several wrong bus stops and times, and thousands of commuters are late for work during the first week.",
    success_phrase:"riders switching to the replacement buses with only short delays",
    failure_phrase:"thousands of commuters being late for work"}
];

const NAMES = {
  man: ["Daniel Harris", "Michael Turner", "Matthew Collins", "Andrew Mitchell", "Thomas Bennett", "James Carter"],
  woman: ["Danielle Foster", "Michelle Hughes", "Emma Reynolds", "Sarah Morgan", "Hannah Brooks", "Jessica Parker"]
};

const CONDITIONS = [];
for (const delegation of ["solo", "human", "llm"]) {
  for (const actorGender of ["man", "woman"]) {
    for (const outcome of ["success", "failure"]) {
      CONDITIONS.push({ delegation, actor_gender: actorGender, outcome });
    }
  }
}

function buildTrials() {
  const conditionOrder = shuffle(CONDITIONS, RNG);
  const taskOrder = shuffle(TASKS, RNG);
  const names = { man: shuffle(NAMES.man, RNG), woman: shuffle(NAMES.woman, RNG) };
  const nameIndex = { man: 0, woman: 0 };

  return conditionOrder.map((condition, index) => {
    const actorGender = condition.actor_gender;
    const trial = {
      ...condition,
      task: taskOrder[index],
      name: names[actorGender][nameIndex[actorGender]],
      full_order_index: index + 1
    };
    nameIndex[actorGender] += 1;
    trial.condition_cell = `${trial.delegation}_${trial.actor_gender}_${trial.outcome}`;
    return trial;
  });
}

function validateFullDesign(trials) {
  const cells = new Set(trials.map(trial => trial.condition_cell));
  const tasks = new Set(trials.map(trial => trial.task.id));
  const maleNames = new Set(trials.filter(trial => trial.actor_gender === "man").map(trial => trial.name));
  const femaleNames = new Set(trials.filter(trial => trial.actor_gender === "woman").map(trial => trial.name));
  if (trials.length !== 12 || cells.size !== 12 || tasks.size !== 12 || maleNames.size !== 6 || femaleNames.size !== 6) {
    throw new Error("The generated experiment does not contain the intended balanced 3 x 2 x 2 design.");
  }
}

const FULL_TRIALS = buildTrials();
validateFullDesign(FULL_TRIALS);
const TRIALS = FULL_TRIALS.slice(0, N_SCENARIOS_PRESENTED);

function prototypeNote() {
  const missing = [];
  if (!CONFIG.LETTER_OF_INFORMATION_URL) missing.push("approved Letter of Information URL");
  if (!COMPLETION_CODE_CONFIGURED) missing.push("Prolific completion code");
  if (missing.length === 0 && !IS_TEST_MODE) return "";
  const details = [];
  if (missing.length) details.push(`Before launch, configure: ${missing.join(" and ")}.`);
  if (IS_TEST_MODE) details.push(`Local test mode is showing ${N_SCENARIOS_PRESENTED} of ${CONFIG.N_SCENARIOS} scenarios.`);
  return `<div class="prototype-note"><strong>Researcher preview:</strong> ${details.join(" ")}</div>`;
}

function progressHTML(index) {

}

function actorPronouns(gender) {
  return gender === "man"
    ? { he: "he", him: "him", his: "his", himself: "himself" }
    : { he: "she", him: "her", his: "her", himself: "herself" };
}

function fillTemplate(text, trial) {
  const pronouns = actorPronouns(trial.actor_gender);
  return text.replace(/\{(Name|he|him|his|himself|He|His)\}/g, function(match, key) {
    if (key === "Name") return trial.name;
    const word = pronouns[key.toLowerCase()];
    return key[0] === key[0].toUpperCase() ? word[0].toUpperCase() + word.slice(1) : word;
  });
}

function makeVignetteHTML(trial) {
  const task = trial.task;
  const decision = `In response, {Name} decides to ${task.action}.`;
  const workDescription = {
    solo: `${decision} {Name} completes all parts of the work personally and prepares the final ${task.object} {himself}.`,
    human: `${decision} {Name} completes most of the work but asks a colleague to complete approximately one-third of it. {Name} reviews the colleague's work, makes any edits {he} thinks are necessary, and incorporates it into the final ${task.object}.`,
    llm: `${decision} {Name} completes most of the work but asks a large language model, such as ChatGPT, to complete approximately one-third of it. {Name} reviews the model's output, makes any edits {he} thinks are necessary, and incorporates it into the final ${task.object}.`
  }[trial.delegation];

  const outcomeText = trial.outcome === "success" ? task.success : task.failure;
  return `

}

// 7-point agreement scale from Genschow et al. (2017).
const LIKERT_LABELS = [
  "Strongly disagree", "Disagree", "Somewhat disagree", "Neither agree nor disagree",
  "Somewhat agree", "Agree", "Strongly agree"
];

// Kitayama person/situation examples; the person examples are adapted for work quality.
const PERSON_EXAMPLES = "character, ability, or effort";
const SITUATION_EXAMPLES = "the atmosphere, social norms, or other contextual factors";

function likertHTML(name, prompt, prefix) {
  const questionId = `${prefix}-${name}-question`;
  const options = LIKERT_LABELS.map(function(label, i) {
    return `
        <label class="likert-option">
          <input type="radio" name="${name}" value="${i + 1}" required>
          <span class="likert-num">${i + 1}</span>
          <span class="likert-text">${label}</span>
        </label>`;
  }).join("");
  return `
    <div class="likert-item" role="radiogroup" aria-labelledby="${questionId}" data-likert="${name}">
      <p class="likert-question" id="${questionId}">${prompt}</p>
      <div class="likert-scale">${options}</div>
    </div>`;
}

function makeRatingHTML(trial, index) {
  const task = trial.task;
  const prefix = `rating-${index}`;
  const item = (name, text) => likertHTML(name, fillTemplate(text, trial), prefix);
  const behaviour = trial.outcome === "success" ? task.success_phrase : task.failure_phrase;

  const primary = trial.outcome === "success"
    ? item("primary_credit", "{Name} deserves credit for what happened.")
    : item("primary_responsibility", "{Name} is responsible for what went wrong.");

  const attribution = [
    item("person_cause", `Features of {Name} (such as {his} ${PERSON_EXAMPLES}) influenced the outcome (${behaviour}).`),
    item("situation_cause", `Features of the environment that surround {Name} (such as ${SITUATION_EXAMPLES}) influenced the outcome (${behaviour}).`),
    item("person_cf", `The outcome would have been different if features of {Name} (such as {his} ${PERSON_EXAMPLES}) had been different.`),
    item("situation_cf", `The outcome would have been different if features of the environment that surround {him} (such as ${SITUATION_EXAMPLES}) had been different.`)
  ];
  if (trial.delegation !== "solo") {
    const helper = trial.delegation === "human" ? "The colleague's" : "The large language model's";
    attribution.push(item("helper_cause", `${helper} contribution influenced the outcome (${behaviour}).`));
  }

  const consequences = [
    item("reward", `As ${task.boss}, I would reward {Name} and give {him} a bonus.`),
    item("punish", `As ${task.boss}, I would punish {Name} and give {him} a formal reprimand.`)
  ].join("");

  return `
    <div class="rating-instructions">Please answer every question before continuing. Indicate how much you agree or disagree with each statement.</div>
    <div class="rating-section-label">Your main judgment</div>
    ${primary}
    <div class="rating-section-label">What influenced the outcome</div>
    ${attribution.join("")}
    <div class="rating-section-label">If you were ${task.boss}</div>
    ${consequences}
    <div class="rating-section-label">Your confidence</div>
    ${item("certainty", "Regarding the statements above, I am sure that my judgments are correct.")}
    <div id="item-completion" class="completion-status" aria-live="polite"></div>`;
}

function bindRequiredItems() {
  const groups = Array.from(document.querySelectorAll("[data-likert]"));
  const submitButton = document.querySelector(".jspsych-btn");
  const status = document.getElementById("item-completion");
  if (!submitButton || groups.length === 0) return;

  submitButton.disabled = true;
  submitButton.setAttribute("aria-disabled", "true");

  function refreshStatus() {
    let remaining = 0;
    for (const group of groups) {
      const answered = group.querySelector("input:checked") !== null;
      group.classList.toggle("answered", answered);
      if (!answered) remaining += 1;
    }
    if (remaining === 0) {
      submitButton.disabled = false;
      submitButton.removeAttribute("aria-disabled");
      if (status) status.textContent = "All questions answered. You can continue.";
    } else if (status) {
      status.textContent = `${remaining} question${remaining === 1 ? "" : "s"} remaining.`;
    }
  }

  for (const group of groups) group.addEventListener("change", refreshStatus);
  refreshStatus();
}

function mean(values) {
  if (values.length === 0 || values.some(value => value === null)) return null;
  return values.reduce((sum, value) => sum + value, 0) / values.length;
}

function numericResponse(response, field) {
  return Object.prototype.hasOwnProperty.call(response, field) ? Number(response[field]) : null;
}

const RATING_FIELDS = [
  "primary_credit", "primary_responsibility", "person_cause", "situation_cause",
  "person_cf", "situation_cf", "helper_cause", "reward", "punish", "certainty"
];

function normalizeRatingData(data) {
  const response = data.response || {};
  for (const field of RATING_FIELDS) data[field] = numericResponse(response, field);
  // Scored as in Genschow et al. (2017): internal minus external attribution.
  data.internal_attribution = mean([data.person_cause, data.person_cf]);
  data.external_attribution = mean([data.situation_cause, data.situation_cf]);
  data.correspondence_bias = data.internal_attribution === null || data.external_attribution === null
    ? null
    : data.internal_attribution - data.external_attribution;
  data.rating_items_answered = Object.keys(response).length;
}

function trialMetadata(trial, index, role) {
  return {
    trial_role: role,
    scenario_index: index + 1,
    full_order_index: trial.full_order_index,
    task_id: trial.task.id,
    task_label: trial.task.label,
    condition_cell: trial.condition_cell,
    delegation: trial.delegation,
    actor_gender: trial.actor_gender,
    actor_name: trial.name,
    outcome: trial.outcome,
    delegate_type: trial.delegation === "human" ? "colleague" : trial.delegation === "llm" ? "llm" : "none"
  };
}

// Free Will Inventory (Nadelhoffer et al., 2014), Part 1, as listed in the
// Genschow et al. (2017) Supporting Information.
const FWI_ITEMS = [
  "People always have the ability to do otherwise.",
  "Everything that has ever happened had to happen precisely as it did, given what happened before.",
  "The fact that we have souls that are distinct from our material bodies is what makes humans unique.",
  "People always have free will.",
  "Every event that has ever occurred, including human decisions and actions, was completely determined by prior events.",
  "Human action can only be understood in terms of our souls and minds and not just in terms of our brains.",
  "How people's lives unfold is completely up to them.",
  "People's choices and actions must happen precisely the way they do because of the laws of nature and the way things were in the distant past.",
  "Each person has a nonphysical essence that makes that person unique.",
  "People ultimately have complete control over their decisions and their actions.",
  "A supercomputer that could know everything about the way the universe is now could know everything about the way the universe will be in the future.",
  "The human mind cannot simply be reduced to the brain.",
  "People have free will even when their choices are completely limited by external circumstances.",
  "Given the way things were at the Big Bang, there is only one way for everything to happen in the universe after that.",
  "The human mind is more than just a complicated biological machine."
];

const FWI_SUBSCALES = {
  free_will: [1, 4, 7, 10, 13],
  determinism: [2, 5, 8, 11, 14],
  dualism: [3, 6, 9, 12, 15]
};

function fwiHTML() {
  const items = FWI_ITEMS.map((text, i) => likertHTML(`fwi_${i + 1}`, `${i + 1}. ${text}`, "fwi")).join("");
  return `
    <div class="study-wrap">
      <div class="paper-card compact ratings-header">
        <div class="eyebrow">Your views</div>
        <h2>Beliefs about people and their choices</h2>
        <p class="muted">Please indicate how much you agree or disagree with each statement. There are no right or wrong answers.</p>
      </div>
      ${items}
      <div id="item-completion" class="completion-status" aria-live="polite"></div>
    </div>`;
}

const fwiPage = {
  type: jsPsychSurveyHtmlForm,
  html: fwiHTML,
  button_label: "Continue",
  on_load: bindRequiredItems,
  data: { trial_role: "free_will_inventory" },
  on_finish: function(data) {
    const response = data.response || {};
    const score = n => data[`fwi_${n}`];
    FWI_ITEMS.forEach((_, i) => { data[`fwi_${i + 1}`] = numericResponse(response, `fwi_${i + 1}`); });
    for (const [subscale, items] of Object.entries(FWI_SUBSCALES)) data[`fwi_${subscale}`] = mean(items.map(score));
    // Compound score as in Genschow et al. (2017): free will + dualism + reversed determinism.
    const compound = [...FWI_SUBSCALES.free_will, ...FWI_SUBSCALES.dualism].map(score)
      .concat(FWI_SUBSCALES.determinism.map(n => score(n) === null ? null : 8 - score(n)));
    data.fwi_compound = mean(compound);
  }
};

              <h2>Your responses have been recorded</h2>
              <p>You may now close this page.</p>
              <p class="small muted">Researcher setup note: configure the Prolific completion code before recruitment.</p>
            </div>
          </div>`;
      }
    }
  };
}

// -----------------------------------------------------------------------------
// TIMELINE ASSEMBLY
// -----------------------------------------------------------------------------
function buildTimeline() {
  const timeline = [];
  if (RUNNING_ON_PAVLOVIA) timeline.push(makePavloviaInit());
  timeline.push(consentPage, welcomePage, instructionsPage);

  TRIALS.forEach(function(trial, index) {
    timeline.push({
      type: jsPsychSurveyHtmlForm,
      html: function() { return makeScenarioPageHTML(trial, index); },
      button_label: "Continue",
      on_load: function() {
        // Keep the Continue button under the questions rather than below both columns.
        const column = document.querySelector(".split-questions");
        const button = document.querySelector(".jspsych-btn");
        if (column && button) column.appendChild(button);
        bindRequiredItems();
        window.scrollTo(0, 0);
      },
      data: trialMetadata(trial, index, "ratings"),
      on_finish: normalizeRatingData
    });
  });

  timeline.push(fwiPage, demographicsPage, finalPage);
  if (RUNNING_ON_PAVLOVIA) timeline.push(makePavloviaFinish());
  return timeline;
}

function startExperiment() {
  if (ensurePavloviaParameters()) return;
  jsPsych.run(buildTimeline());
}

window.addEventListener("load", startExperiment);
</script>
</html>
